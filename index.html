{id:84,num:28,titulo:"Galletas de Vainilla",tipo:"Postre",tiempo:"18 min",prep:"8 min",airfryer:"7-9 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:8,ings:["1/2 taza de harina de trigo","3 cdas de azúcar","2 cdas de mantequilla derretida","1 huevo pequeño","1/2 cdta de esencia de vainilla","1/2 cdta de polvo de hornear","1 pizca de sal","Azúcar pulverizada opcional para decorar"],pasos:["Mezcla mantequilla, azúcar, huevo y vainilla.","Agrega harina, polvo de hornear y sal.","Forma bolitas pequeñas y aplánalas suavemente.","Cocina en Air Fryer a 160°C por 7-9 minutos.","Deja enfriar antes de servir para que tomen mejor textura."],tip:"No las cocines demasiado para que queden suaves y no secas. Al salir se afirman.",consejo:""},
{id:85,num:29,titulo:"Lomitos de Pollo Crispy Buffalo",tipo:"Plato principal",tiempo:"35 min",prep:"15 min",airfryer:"12-15 min",temp:"190°C",cal:"450 kcal",prot:"39g",carb:"28g",gras:"20g",servings:2,ings:["1 pechuga de pollo en tiras gruesas","1 huevo batido","1/4 taza de miga de pan o panko","2 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","2 cdas de salsa picante suave tipo buffalo o mezcla de salsa de tomate con gotas de ají","1 cda de mantequilla derretida","Aceite en spray"],pasos:["Sazona las tiras de pollo con ajo en polvo, paprika, sal y pimienta.","Pasa el pollo por harina, luego huevo y finalmente miga de pan o panko.","Rocía ligeramente con aceite y coloca en la Air Fryer sin encimarlos.","Cocina a 190°C por 12-15 minutos, volteando a mitad de cocción.","Mezcla salsa buffalo con mantequilla y barniza el pollo al final."],tip:"Si no te gusta el picante, usa menos salsa buffalo y mezcla con un poco más de salsa de tomate.",consejo:"No agregues la salsa desde el inicio para que el apanado conserve su textura crocante."},
{id:86,num:29,titulo:"Mazorca Desgranada con Mantequilla y Cilantro",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 tazas de maíz desgranado cocido","1 cda de mantequilla derretida","1 cda de cilantro fresco picado","1/2 cdta de ajo en polvo","Sal y pimienta al gusto","Queso rallado opcional","Gotas de limón opcional"],pasos:["Mezcla el maíz desgranado con mantequilla, ajo en polvo, sal y pimienta.","Coloca el maíz en un recipiente apto para Air Fryer o sobre papel para hornear.","Cocina en Air Fryer a 180°C por 8-10 minutos, moviendo a mitad de cocción.","Agrega cilantro fresco y queso rallado al servir si deseas.","Finaliza con unas gotas de limón para más sabor."],tip:"No cocines demasiado el maíz para que conserve textura jugosa y no se reseque.",consejo:""},
{id:87,num:29,titulo:"Donas de Manzana con Salsa de Yogur",tipo:"Postre",tiempo:"25 min",prep:"10 min",airfryer:"10-12 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:4,ings:["1 manzana mediana rallada","1/2 taza de harina de trigo","1 huevo pequeño","2 cdas de azúcar morena o panela pulverizada","2 cdas de leche","1 cdta de mantequilla derretida","1/2 cdta de canela en polvo","1/2 cdta de polvo de hornear","1 pizca de sal","1/4 taza de yogur griego natural","1 cda de miel"],pasos:["Mezcla huevo, leche, mantequilla y azúcar.","Agrega harina, polvo de hornear, canela y sal.","Incorpora la manzana rallada y mezcla suavemente.","Coloca la mezcla en moldes pequeños para donas aptos para Air Fryer.","Cocina a 160°C por 10-12 minutos. Mezcla yogur griego con miel y sirve como salsa."],tip:"Ralla la manzana fina para que las donas queden más suaves y húmedas.",consejo:""},
{id:88,num:30,titulo:"Carne en Tiras Estilo Fajitas",tipo:"Plato principal",tiempo:"30 min",prep:"12 min",airfryer:"12-15 min",temp:"190°C",cal:"410 kcal",prot:"34g",carb:"10g",gras:"26g",servings:2,ings:["350 g de carne de res blanda en tiras","1/2 pimentón rojo en tiras","1/2 pimentón verde o amarillo en tiras opcional","1/2 cebolla cabezona en plumas","1 cda de aceite","1/2 cdta de ajo en polvo","1/2 cdta de paprika","1/2 cdta de comino opcional","Sal y pimienta al gusto","Gotas de limón opcional","Cilantro o perejil picado opcional"],pasos:["Mezcla la carne con aceite, ajo en polvo, paprika, comino, sal y pimienta.","Agrega pimentón y cebolla en tiras.","Coloca todo en la Air Fryer sin llenar demasiado la canasta.","Cocina a 190°C por 12-15 minutos, moviendo a mitad de cocción.","Sirve con gotas de limón y cilantro si deseas."],tip:"No cortes la carne demasiado gruesa para que quede jugosa y se cocine rápido.",consejo:"Si quieres más dorado, cocina los últimos 2 minutos sin los vegetales encima de la carne."},
{id:89,num:30,titulo:"Tortillas Crocantes con Queso",tipo:"Acompañamiento",tiempo:"14 min",prep:"5 min",airfryer:"6-8 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 tortillas medianas de trigo o maíz","1/2 taza de queso mozzarella o queso rallado","1/2 cdta de orégano seco opcional","1 cdta de mantequilla derretida o aceite","Salsa al gusto opcional"],pasos:["Unta ligeramente las tortillas con mantequilla o aceite.","Agrega queso rallado y orégano si deseas.","Dobla las tortillas o córtalas en triángulos.","Cocina en Air Fryer a 180°C por 6-8 minutos, hasta que estén doradas y crocantes."],tip:"No pongas demasiado queso para evitar que se salga y se queme en la canasta.",consejo:""},
{id:90,num:30,titulo:"Churros Rápidos en Air Fryer",tipo:"Postre",tiempo:"22 min",prep:"10 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:6,ings:["1/2 taza de harina de trigo","1/2 taza de agua","1 cda de mantequilla","1 cda de azúcar","1 pizca de sal","1/2 cdta de esencia de vainilla opcional","Azúcar con canela para cubrir","Arequipe o chocolate opcional para servir"],pasos:["Calienta agua con mantequilla, azúcar y sal hasta que hierva suavemente.","Agrega la harina y mezcla hasta formar una masa suave.","Deja enfriar un poco y agrega vainilla si deseas.","Forma tiras pequeñas tipo churro sobre papel para hornear.","Cocina en Air Fryer a 180°C por 8-10 minutos. Pásalos por azúcar con canela al servir."],tip:"Haz churros pequeños y delgados para que se cocinen bien por dentro y queden dorados por fuera.",consejo:""}
];

const POSTRES=[
{id:1,titulo:"Brownie Súper Chocolatoso en Sartén",categoria:"Brownies y Chocolate",tiempo:"20 min",servings:2,emoji:"🍫",desc:"Húmedo, intenso y bien chocolatudo. Centro suave tipo fudge, sin horno.",ings:["3 cucharadas de mantequilla","1/3 taza de azúcar","3 cucharadas de cocoa en polvo sin azúcar","1 huevo","1 cucharadita de esencia de vainilla","1/4 taza de harina de trigo","2 cucharadas de leche","1 pizca de sal","3 cucharadas de chispas de chocolate o chocolate picado","Nueces picadas opcional"],pasos:["Derrite la mantequilla en una sartén antiadherente pequeña a fuego bajito.","Agrega el azúcar y mezcla bien. Este paso ayuda a que el brownie quede más húmedo.","Añade la cocoa y mezcla hasta formar una pasta chocolatosa intensa.","Apaga el fuego unos 30 segundos antes de agregar el huevo para que no se cocine.","Agrega el huevo, la vainilla y la leche. Mezcla rápido hasta que todo quede brillante.","Incorpora la harina y la pizca de sal. Mezcla solo hasta integrar.","Añade el chocolate picado o las chispas.","Cocina en la misma sartén a fuego MUY bajito con tapa durante 10 a 12 minutos.","Apaga el fuego y deja reposar 5 minutos antes de cortar."],tip:"Pon un paño limpio entre la tapa y la sartén mientras cocina para que el vapor no caiga sobre el brownie.",consejo:"Sírvelo tibio con una bola de helado de vainilla o unas fresas encima."},
{id:2,titulo:"Brownie con Mezcla de Frutos Secos",categoria:"Brownies y Chocolate",tiempo:"35 min",servings:2,emoji:"🍫",desc:"Intenso de chocolate, húmedo por dentro, con frutos secos tostados irresistibles.",ings:["100 g de chocolate semiamargo","50 g de mantequilla","1 huevo grande","4 cucharadas de azúcar morena","1 cucharadita de vainilla","4 cucharadas de harina de trigo","1 cucharada de cocoa en polvo","1 pizca de sal","1/3 taza de frutos secos mixtos (nueces, almendras, maní, avellanas)","1 cucharada de chispas de chocolate opcional"],pasos:["Precalienta el horno a 175°C y engrasea un molde pequeño.","Tuesta los frutos secos en una sartén seca durante 2 a 3 minutos.","Derrite el chocolate y la mantequilla a fuego muy bajo o en microondas.","Bate el huevo con el azúcar durante 2 minutos hasta que la mezcla esté más clara.","Incorpora el chocolate tibio, nunca caliente, para evitar que el huevo se cocine.","Añade los ingredientes secos: harina, cocoa y sal. Mezcla solo hasta integrar.","Agrega los frutos secos reservando un poco para poner encima antes de hornear.","Hornea entre 18 y 22 minutos. El centro debe verse apenas húmedo.","Espera al menos 15 minutos antes de cortar para que tome textura fudgy."],tip:"Añade 1 cucharadita de café instantáneo al chocolate derretido para intensificar el sabor sin saber a café.",consejo:"Sirve el brownie ligeramente tibio con yogur griego o helado de vainilla. Contraste increíble."},
{id:3,titulo:"Mug Cake de Oreo",categoria:"Brownies y Chocolate",tiempo:"7 min",servings:2,emoji:"🍪",desc:"Postre rápido, suave y súper chocolatado que se hace en minutos en microondas.",ings:["8 galletas Oreo","1/2 taza de leche","1/2 cucharadita de polvo para hornear","1 cucharada de cocoa en polvo opcional","2 cucharadas de chispas de chocolate o chocolate picado","Crema chantilly o helado opcional"],pasos:["Tritura las galletas Oreo hasta que queden bien desmenuzadas.","Coloca las Oreo trituradas en una taza grande o bowl apto para microondas.","Agrega la leche y mezcla bien. Deja reposar 1 minuto para que las galletas absorban el líquido.","Añade el polvo para hornear y la cocoa si quieres más sabor a chocolate.","Incorpora el chocolate picado.","Lleva al microondas entre 1 minuto 30 segundos y 2 minutos. El centro debe verse ligeramente húmedo.","Deja reposar 1 minuto antes de comer."],tip:"Usa una taza grande porque la mezcla sube mientras cocina y puede derramarse si el recipiente es pequeño.",consejo:"Pon una Oreo triturada encima y acompaña con helado de vainilla. El contraste frío con el mug cake caliente queda increíble."},
{id:4,titulo:"Pizza de Chocolate Suprema",categoria:"Brownies y Chocolate",tiempo:"25 min",servings:4,emoji:"🍕",desc:"Pizza dulce, cremosa y crujiente, cargada de chocolate y los mejores toppings.",ings:["1 masa de pizza lista","1 cucharada de mantequilla derretida","150 g de chocolate semiamargo","100 ml de crema de leche","1 cucharada de mantequilla","1 cucharadita de vainilla","1 pizca pequeña de sal","4 fresas frescas en rodajas","4 galletas Oreo trituradas","Chispas de chocolate blanco","Mini marshmallows opcional","Avellanas o maní triturado opcional"],pasos:["Precalienta el horno a 200°C.","Pon la masa sobre una bandeja y pínchala ligeramente con un tenedor.","Unta la mantequilla derretida sobre los bordes.","Hornea la base 12 a 15 minutos hasta que esté apenas dorada.","Haz la crema: en una olla pequeña agrega chocolate, crema de leche, mantequilla, vainilla y sal.","Cocina a fuego bajo revolviendo constantemente hasta que el chocolate se derrita.","Cubre la pizza caliente con la crema de chocolate apenas salga del horno.","Agrega los toppings: fresas, Oreo triturada y chispas de chocolate blanco.","Deja reposar 3 minutos antes de cortar."],tip:"Si quieres una pizza de chocolate MÁS especial, mezcla mitad chocolate semiamargo y mitad chocolate de leche.",consejo:"Agrega los marshmallows los últimos 2 minutos en el horno para que queden apenas doraditos y derretidos."},
{id:5,titulo:"Arroz con Leche Cremoso",categoria:"Postres Tradicionales",tiempo:"45 min",servings:2,emoji:"🍚",desc:"Casero, suave y bien cremoso, con aroma a canela y textura melosa reconfortante.",ings:["1/2 taza de arroz","2 tazas de agua","2 tazas de leche","1 astilla de canela","3 cucharadas de azúcar","1/3 taza de leche condensada","1 cucharadita de vainilla","1 pizca de sal","Canela en polvo para decorar","Uvas pasas opcional"],pasos:["Lava ligeramente el arroz solo una vez. No lo laves demasiado.","Cocina el arroz con el agua, la canela en astilla y la pizca de sal a fuego medio.","Agrega la leche poco a poco y baja el fuego. Cocinar lento es el secreto.","Revuelve cada pocos minutos especialmente el fondo de la olla.","Cuando el arroz esté suave y la mezcla cremosa, agrega el azúcar, la leche condensada y la vainilla.","Cocina 5 a 10 minutos más hasta obtener una consistencia espesa pero algo líquida. Al enfriarse espesa más.","Si usas pasas, agrégalas al final para que se hidraten sin ponerse muy blandas.","Retira la canela y deja reposar unos minutos antes de servir."],tip:"Si quieres un arroz con leche todavía más cremoso, agrega 2 cucharadas extra de crema de leche al final cuando apagues el fuego.",consejo:"Sírvelo tibio con un poco de canela encima o frío después de varias horas en nevera."},
{id:6,titulo:"Gelatina Mosaico Cremosa",categoria:"Postres Tradicionales",tiempo:"25 min + 4h refrigeración",servings:2,emoji:"🌈",desc:"Colorida, fresca y muy cremosa. Cubitos de gelatina de colores en mezcla suave de leche condensada.",ings:["1 sobre de gelatina sabor fresa","1 sobre de gelatina sabor limón","1 sobre de gelatina sabor uva o mora","Agua según las instrucciones de cada sobre","1 taza de leche","1/2 taza de leche condensada","100 ml de crema de leche","1 cucharadita de vainilla","1 sobre (7g) de gelatina sin sabor","1/4 taza de agua fría"],pasos:["Prepara las gelatinas de colores por separado siguiendo las instrucciones del paquete.","Refrigera hasta que cuajen usando recipientes bajos para que sea más fácil cortar los cubos.","Una vez firmes, córtalas en cuadros pequeños y resérvalos.","Hidrata la gelatina sin sabor mezclándola con el agua fría y deja reposar 5 minutos.","En un recipiente mezcla la leche, leche condensada, crema de leche y vainilla.","Calienta la gelatina hidratada unos segundos hasta que quede líquida y agrégala a la mezcla cremosa.","Coloca los cubitos de colores en un molde o recipiente transparente.","Vierte la mezcla cremosa lentamente para que los cubos se distribuyan de manera uniforme.","Refrigera durante 3 a 4 horas o hasta que esté completamente firme.","Desmolda y sirve. Si usas molde, pasa un cuchillo por los bordes."],tip:"Prepara las gelatinas de colores con un poco menos de agua de la indicada para que los cubitos queden más firmes.",consejo:"Para un sabor más especial, agrega ralladura de limón o naranja a la mezcla cremosa."},
{id:7,titulo:"Cheesecake de Maracuyá Sin Horno",categoria:"Cheesecakes Sin Horno",tiempo:"25 min + 3h refrigeración",servings:2,emoji:"🧀",desc:"Ligero, cremoso y perfecto con la pulpa tropical de maracuyá. Sin horno.",ings:["1 taza de galletas trituradas (Ducales, Festival o María)","3 cucharadas de mantequilla derretida","190 g de queso crema","1/2 taza de crema de leche fría","1/3 taza de leche condensada","1/3 taza de pulpa de maracuyá sin semillas","1 cucharadita de vainilla","Jugo de 1/2 limón","1/3 taza de pulpa de maracuyá (para la salsa)","2 cucharadas de azúcar","2 cucharadas de agua"],pasos:["Mezcla las galletas trituradas con la mantequilla derretida hasta obtener textura de arena húmeda.","Presiona la mezcla en vasos, copas o un molde pequeño. Compacta bien.","Lleva la base a la nevera mientras haces el relleno.","En un bowl bate el queso crema hasta que quede suave y sin grumos.","Agrega la leche condensada, la vainilla, el limón y la pulpa de maracuyá.","En otro recipiente bate ligeramente la crema de leche fría hasta que espese un poco.","Incorpora la crema batida con movimientos suaves.","Vierte la mezcla sobre la base y refrigera mínimo 3 horas.","Para la salsa, cocina la pulpa de maracuyá con azúcar y agua durante 3 a 4 minutos hasta que espese.","Deja enfriar la salsa antes de ponerla encima del cheesecake."],tip:"Si quieres un cheesecake más firme sin usar horno, puedes agregar 1 cucharadita de gelatina sin sabor hidratada y tibia al relleno.",consejo:"Agrega un poco de ralladura de limón encima al servir para que el sabor del maracuyá resalte muchísimo más."},
{id:8,titulo:"Cheesecake de Limón Sin Horno",categoria:"Cheesecakes Sin Horno",tiempo:"25 min + 3h refrigeración",servings:2,emoji:"🍋",desc:"Fresco, cremoso y suave, con ese sabor cítrico delicioso que lo hace súper antojable.",ings:["1 taza de galletas trituradas (María, Ducales o vainilla)","3 cucharadas de mantequilla derretida","190 g de queso crema","1/2 taza de crema de leche fría","1/3 taza de leche condensada","Jugo de 2 limones","Ralladura de 1 limón","1 cucharadita de vainilla","Ralladura extra de limón para decorar","Rodajas finas de limón para decorar","Galleta triturada para decorar"],pasos:["Mezcla las galletas trituradas con la mantequilla hasta obtener textura de arena húmeda.","Presiona la mezcla en vasos o molde pequeño. Compactar bien.","Lleva la base a la nevera mientras preparas el relleno.","En un bowl bate el queso crema hasta que quede suave y sin grumos.","Agrega la leche condensada, la vainilla, el jugo y la ralladura de limón.","Bate aparte la crema de leche fría hasta que espese ligeramente.","Incorpora la crema con movimientos suaves para mantener una textura ligera y sedosa.","Vierte la mezcla sobre la base y refrigera mínimo 3 horas.","Decora con ralladura de limón justo antes de servir para que conserve el aroma fresco."],tip:"No agregues demasiado jugo de limón de una sola vez porque puede cortar la mezcla y volverla granulosa.",consejo:"Si quieres un sabor todavía más fresco, agrega unas gotitas de limón al servir y acompaña con frutas rojas."},
{id:9,titulo:"Cheesecake de Café Sin Horno",categoria:"Cheesecakes Sin Horno",tiempo:"25 min + 3h refrigeración",servings:2,emoji:"☕",desc:"Cremoso y suave con delicioso sabor tipo cappuccino. Textura fría y sedosa, postre de cafetería.",ings:["1 taza de galletas trituradas (chocolate o vainilla)","3 cucharadas de mantequilla derretida","190 g de queso crema","1/2 taza de crema de leche fría","1/3 taza de leche condensada","1 cucharada de café instantáneo","1 cucharada de agua caliente","1 cucharadita de vainilla","1 pizca de canela opcional","Cocoa en polvo para decorar","Chocolate rallado para decorar"],pasos:["Mezcla las galletas trituradas con la mantequilla hasta formar textura de arena húmeda.","Presiona la mezcla en vasos o molde pequeño y lleva a la nevera mientras haces el relleno.","Disuelve el café instantáneo en la cucharada de agua caliente. Hazlo concentrado para obtener mucho sabor.","En un bowl bate el queso crema hasta que quede suave y cremoso.","Agrega la leche condensada, la vainilla, el café disuelto y la pizca de canela.","En otro recipiente bate ligeramente la crema de leche fría hasta que espese un poco.","Incorpora la crema batida con movimientos suaves.","Vierte la mezcla sobre la base y refrigera mínimo 3 horas.","Antes de servir, espolvorea cocoa o chocolate rallado encima."],tip:"No uses demasiado café instantáneo porque puede dejar sabor amargo. Mejor usar poco pero bien concentrado.",consejo:"Si quieres un toque tipo tiramisú, humedece ligeramente la base con unas gotas de café frío antes de agregar el relleno."},
{id:10,titulo:"Pavé Cremoso de Chocolate y Galleta",categoria:"Pavés Cremosos",tiempo:"25 min + 2h refrigeración",servings:2,emoji:"🎂",desc:"Postre frío, cremosito y súper antojable con capas de galleta suave y crema dulce.",ings:["1 taza de leche","1 cucharada de maicena","1 yema de huevo","3 cucharadas de leche condensada","1 cucharadita de vainilla","1 paquete pequeño de galletas Ducales o María","1/2 taza de leche para remojar","1 cucharadita de café instantáneo opcional","80 g de chocolate semiamargo","3 cucharadas de crema de leche"],pasos:["Haz la crema base: en una olla mezcla la leche, maicena, yema y leche condensada antes de prender el fuego.","Cocina a fuego medio revolviendo constantemente hasta que espese y quede como una natilla suave. Agrega la vainilla.","Tapa la crema con plástico tocando la superficie para que no forme costra. Deja enfriar un poco.","Prepara el líquido para las galletas: mezcla la leche con el café instantáneo.","Arma las capas: galletas ligeramente remojadas, capa de crema, otra capa de galletas, más crema.","Haz la ganache de chocolate: derrite el chocolate junto con la crema de leche en microondas en tandas cortas.","Cubre el pavé con la ganache y distribuye suavemente.","Refrigera mínimo 2 horas. El frío ayuda a que las capas se integren y la textura quede rica y firme."],tip:"Si quieres un pavé MÁS cremoso y elegante, agrega una cucharada de queso crema a la crema caliente.",consejo:"Antes de servir, agrega cacao en polvo, chocolate rallado o trocitos de Oreo encima. El contraste crocante con la crema fría queda increíble."},
{id:11,titulo:"Mousse Cremoso de Naranja",categoria:"Mousses y Cremas Frías",tiempo:"20 min + 3h refrigeración",servings:2,emoji:"🍊",desc:"Fresco, aireado y súper suave, con sabor natural a naranja que se derrite en la boca.",ings:["1 taza de jugo de naranja natural","Ralladura de 1 naranja","1/2 taza de leche condensada","200 ml de crema de leche fría","1 cucharadita de gelatina sin sabor","2 cucharadas de agua","1 cucharadita de vainilla opcional"],pasos:["Hidrata la gelatina: mezcla la gelatina sin sabor con las 2 cucharadas de agua y deja reposar 5 minutos.","Disuelve la gelatina: caliéntala apenas unos segundos hasta que quede líquida. No debe hervir.","Prepara la base de naranja: mezcla el jugo de naranja, la ralladura y la leche condensada.","Bate la crema de leche fría hasta que tome textura espesa y aireada. La crema debe estar bien fría.","Integra suavemente la crema batida a la mezcla de naranja usando movimientos envolventes.","Añade la gelatina disuelta incorporándola lentamente mientras mezclas.","Lleva a refrigeración mínimo 3 horas hasta que tome consistencia firme y cremosa."],tip:"No uses jugo artificial. El jugo natural hace una diferencia enorme en aroma, frescura y sabor real.",consejo:"Decora con ralladura de naranja, trocitos de chocolate o galleta triturada. El contraste cítrico con algo crocante queda delicioso."},
{id:12,titulo:"Mousse de Yogur con Frutos Rojos",categoria:"Mousses y Cremas Frías",tiempo:"20 min + 3h refrigeración",servings:2,emoji:"🍓",desc:"Fresco, cremoso y ligero con el equilibrio perfecto entre el dulzor del yogur y los frutos rojos.",ings:["1 taza de yogur griego natural frío","200 ml de crema de leche fría","3 cucharadas de leche condensada o miel","1 cucharadita de vainilla","1 cucharadita de gelatina sin sabor","2 cucharadas de agua","1 taza de frutos rojos (fresa, mora, arándanos o mezcla)","2 cucharadas de azúcar","1 cucharadita de jugo de limón","Galleta triturada o granola opcional"],pasos:["Haz la salsa de frutos rojos: lleva las frutas a una sartén con azúcar y limón.","Cocina pocos minutos hasta que suelten sus jugos. No cocines demasiado para conservar el color.","Deja enfriar completamente antes de usar.","Hidrata la gelatina con agua y deja reposar 5 minutos. Luego caliéntala hasta que quede líquida.","Bate la crema de leche fría hasta que esté espesa y cremosa.","Mezcla la base: combina yogur, leche condensada y vainilla.","Integra la crema batida con movimientos envolventes para mantener el mousse ligero y aireado.","Agrega la gelatina mezclándola lentamente.","Arma el postre: sirve mousse y encima agrega la salsa de frutos rojos.","Refrigera mínimo 3 horas. El mousse toma mejor textura mientras más frío esté."],tip:"Usa yogur griego porque tiene menos agua y deja el mousse mucho más cremoso y estable.",consejo:"Agrega una capa de galleta triturada o granola en el fondo del vaso. El contraste crocante con el mousse frío queda espectacular."},
{id:13,titulo:"Mousse de Limón con Leche Condensada",categoria:"Mousses y Cremas Frías",tiempo:"15 min + 2h refrigeración",servings:2,emoji:"🍋",desc:"Fresco, cremoso y súper suave, con el equilibrio perfecto entre dulce y ácido.",ings:["1 taza de crema de leche fría","1/2 taza de leche condensada","Jugo de 3 limones","Ralladura de 1 limón","1 cucharadita de vainilla opcional","Galleta triturada para decorar opcional"],pasos:["Bate la crema de leche fría hasta que tome textura cremosa y aireada. No necesitas que quede demasiado firme.","Mezcla la leche condensada con el limón. Verás que la mezcla empieza a espesar naturalmente gracias a la acidez del limón.","Añade ralladura de limón. Esto intensifica muchísimo el aroma.","Integra la crema batida con movimientos envolventes para mantener el aire y lograr textura ligera.","Sirve en vasos o copas. Puedes hacer capas con galleta triturada si quieres más textura.","Refrigera mínimo 2 horas. Bien frío queda mucho más cremoso y el sabor se intensifica."],tip:"No uses demasiado jugo de limón de una sola vez porque puede cortar la mezcla y volverla granulosa. Agrégalo poco a poco.",consejo:"Decora con ralladura extra, galleta triturada o unas hojitas de hierbabuena. El contraste fresco queda espectacular."},
{id:14,titulo:"Crema de Yogur con Puré de Mango y Lima",categoria:"Mousses y Cremas Frías",tiempo:"15 min + 1h refrigeración",servings:2,emoji:"🥭",desc:"Fresco, cremoso y cítrico con capas de mango natural y yogur suave. Ligero y elegante.",ings:["1 taza de yogur griego natural frío","3 cucharadas de leche condensada","1 cucharadita de vainilla","2 cucharadas de crema de leche opcional","1 mango maduro grande","Jugo de 1 lima","Ralladura fina de 1/2 lima","1 cucharada de miel opcional","Cubitos pequeños de mango","Ralladura de lima","Hojas de hierbabuena o menta","Galleta triturada o granola opcional"],pasos:["Prepara el puré de mango: pela el mango y licúalo junto con el jugo de lima hasta obtener una mezcla suave y brillante.","Ajusta el sabor: prueba el puré. Si el mango no está muy dulce, añade una cucharada de miel.","Prepara la crema de yogur: mezcla el yogur, la leche condensada, la vainilla y la crema de leche.","Añade la ralladura de lima. Esto aporta un aroma fresco que hace que el postre se sienta mucho más vibrante.","Arma las copas: coloca una capa de puré de mango, luego una capa de crema de yogur y repite una vez más.","Refrigera durante al menos 1 hora para que los sabores se integren y la textura sea más cremosa.","Decora antes de servir: añade cubitos de mango, ralladura de lima y unas hojas de menta."],tip:"Usa un mango bien maduro tipo azúcar, Tommy o Kent. Cuanto más maduro esté, más dulce y aromático quedará el puré.",consejo:"Para una versión más especial, agrega una capa fina de galleta triturada entre el mango y el yogur."},
{id:15,titulo:"Pudding de Chía y Chocolate con Yogur",categoria:"Puddings",tiempo:"15 min + 4h refrigeración",servings:2,emoji:"🌿",desc:"Cremoso, fresco y lleno de textura. Chocolate, yogur y frutas frescas en combinación perfecta.",ings:["4 cucharadas de semillas de chía","1 taza de leche","1 cucharada de cocoa en polvo","2 cucharadas de miel o leche condensada","1 cucharadita de vainilla","1 pizca pequeña de sal","1 taza de yogur griego frío","1 cucharada de miel opcional","Chocolate rallado","Banano en rodajas","Fresas","Granola o nueces picadas"],pasos:["Mezcla la base de chocolate: en un recipiente agrega la leche, cocoa, miel, vainilla y pizca de sal. Mezcla muy bien.","Añade las semillas de chía. Revuelve durante 1 minuto para evitar que las semillas se peguen todas en el fondo.","Deja reposar 10 minutos. Luego vuelve a mezclar. Este pequeño truco ayuda a que el pudding quede más uniforme.","Refrigera mínimo 4 horas. Mientras más tiempo repose, más espeso y rico queda.","Prepara la capa de yogur: mezcla el yogur con un poco de miel si quieres un sabor más dulce.","Arma el pudding: sirve primero la mezcla de chía y encima agrega el yogur.","Decora: añade fruta fresca, chocolate rallado y un poco de granola para darle contraste crocante."],tip:"La pizca de sal parece pequeña pero hace que el chocolate tenga un sabor mucho más intenso y equilibrado.",consejo:"Si quieres una textura todavía más tipo mousse, licúa la mezcla antes de refrigerar. El pudding queda ultra cremoso y suave."},
{id:16,titulo:"Crumbl Cookies de Macadamias y Chocolate Blanco",categoria:"Cookies Premium",tiempo:"30 min + 30 min reposo",servings:6,emoji:"🍪",desc:"Galletas grandes, suaves por dentro, con bordes dorados y llenas de macadamias y chocolate blanco.",ings:["115 g de mantequilla sin sal a temperatura ambiente","1/2 taza de azúcar morena","1/4 taza de azúcar blanca","1 huevo","1 cucharadita de vainilla","1 1/2 tazas de harina de trigo","1 cucharada de maicena","1/2 cucharadita de bicarbonato","1 pizca de sal","100 g de chocolate blanco picado","3/4 taza de nueces de macadamia picadas"],pasos:["Bate la mantequilla y los azúcares durante 2 a 3 minutos hasta obtener una crema suave y esponjosa.","Agrega los ingredientes líquidos: incorpora el huevo y la vainilla hasta integrar.","Añade los ingredientes secos: agrega harina, maicena, bicarbonato y sal. Mezcla solo hasta que desaparezca la harina.","Incorpora los tropezones: añade el chocolate blanco y las macadamias.","Forma bolas grandes. Las Crumbl Cookies son famosas por su tamaño grande y su centro suave.","Refrigera la masa 30 minutos. Este secreto evita que las galletas se expandan demasiado y mejora el sabor.","Hornea: coloca las porciones separadas entre sí y aplánalas apenas un poco. Cocina hasta que los bordes estén dorados y el centro ligeramente suave.","Deja reposar 10 minutos. Las galletas continúan cocinándose con el calor residual."],tip:"Tuesta las macadamias durante 4 minutos antes de agregarlas a la masa. Esto potencia su sabor y aroma de forma impresionante.",consejo:"Reserva algunos trozos de chocolate blanco y macadamias para colocarlos encima de cada bola de masa antes de hornear. Así las galletas quedan mucho más atractivas."}
];
const S={tab:'search',view:'main',searchQ:'',searchR:null,selected:null,servings:2,checked:{},fridgeQ:'',fridgeR:null,altMode:false,selectedPostre:null,postresView:'list'};
function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtQ(n){if(!n&&n!==0)return'';const r=Math.round(n*4)/4;if(r===Math.floor(r))return''+Math.floor(r);const f=r-Math.floor(r),b=Math.floor(r)||'';if(Math.abs(f-.5)<.01)return b+'\u00bd';if(Math.abs(f-.25)<.01)return b+'\u00bc';if(Math.abs(f-.75)<.01)return b+'\u00be';return r.toFixed(1);}
function parseIng(line){const cl=(line||'').replace(/^[\u2022\-\*\u00b7]\s*/,'').trim();const m=cl.match(/^(\d+(?:[,\.]\d+)?(?:\/\d+)?)\s*(tazas?|cucharadas?|cucharaditas?|cdas?\.?|cditas?\.?|kg|kgs?|g|gr|gramos?|litros?|lts?|ml|mls?|piezas?|dientes?|ramas?|sobres?|latas?|lb|libras?|oz|vasos?|unidades?)?\s*(?:de\s+)?(.+)/i);if(m){let q=m[1];if(q.includes('/'))q=parseFloat(q.split('/')[0])/parseFloat(q.split('/')[1]);else q=parseFloat(q.replace(',','.'));return{original:cl,qty:q,unit:m[2]||'',name:m[3].trim(),scalable:true};}return{original:cl,scalable:false};}
function render(){
  const el=document.getElementById('content');
  ['search','index','fridge','postres'].forEach(t=>{document.getElementById('tab-'+t).classList.toggle('active',S.tab===t);});
  if(S.view==='recipe'){renderRecipe(el);return;}
  if(S.tab==='search')renderSearch(el);
  else if(S.tab==='index')renderIndex(el);
  else if(S.tab==='fridge')renderFridge(el);
  else if(S.tab==='postres'){if(S.selectedPostre)renderPostreDetail(el);else renderPostres(el);}
}
function renderSearch(el){
  let res='';
  if(S.searchR===null){res=`<div class="empty"><i class="ti ti-search"></i><p>Escribe "pollo", "cerdo", "postre"<br>o el nombre de cualquier plato</p></div>`;}
  else if(S.searchR.length===0){res=`<div class="empty"><i class="ti ti-mood-sad"></i><p>Sin resultados para<br><strong>"${esc(S.searchQ)}"</strong></p></div>`;}
  else{const rows=S.searchR.map(m=>`<div class="recipe-card" onclick="openRecipe(${m.id})"><div class="recipe-card-inner"><div class="menu-badge"><span>${m.num}</span><small style="font-size:9px">MEN\u00da</small></div><div style="flex:1"><div class="card-title">${esc(m.titulo)}</div><div class="card-meta"><span style="color:${m.tipo==='Plato principal'?'#C85C1E':m.tipo==='Acompa\u00f1amiento'?'#4A7C2F':'#B8860B'}">${m.tipo}</span><span>\u23f1 ${m.tiempo}</span>${m.temp?`<span>\ud83c\udf21 ${m.temp}</span>`:''}</div></div><i class="ti ti-chevron-right card-arrow"></i></div></div>`).join('');
  res=`<p style="font-size:13px;color:var(--muted);margin-bottom:12px">${S.searchR.length} resultado${S.searchR.length>1?'s':''} para "<strong>${esc(S.searchQ)}</strong>"</p>${rows}`;}
  el.innerHTML=`<div class="search-wrap"><input type="text" id="si" value="${esc(S.searchQ)}" placeholder="Buscar receta, ingrediente..." onkeydown="if(event.key==='Enter')doSearch()"><button class="search-btn" onclick="doSearch()"><i class="ti ti-search"></i></button></div>${res}`;
}
function renderIndex(el){
  const byNum={};
  MENUS.filter(m=>m.tipo==='Plato principal').forEach(m=>{byNum[m.num]={principal:m,acomp:MENUS.find(x=>x.num===m.num&&x.tipo==='Acompa\u00f1amiento'),postre:MENUS.find(x=>x.num===m.num&&x.tipo==='Postre')};});
  const groups=[{label:'Men\u00fas 1 al 10',s:1,e:10},{label:'Men\u00fas 11 al 20',s:11,e:20},{label:'Men\u00fas 21 al 30',s:21,e:30}];
  el.innerHTML=groups.map(g=>{
    const nums=Object.keys(byNum).map(Number).filter(n=>n>=g.s&&n<=g.e).sort((a,b)=>a-b);
    const rows=nums.map(n=>{const {principal,acomp,postre}=byNum[n];return `<div class="recipe-card" onclick="openRecipe(${principal.id})"><div class="recipe-card-inner"><div class="menu-badge"><span>${n}</span><small style="font-size:9px">MEN\u00da</small></div><div style="flex:1"><div class="card-title">${esc(principal.titulo)}</div><div class="card-meta">${acomp?`<span>+ ${esc(acomp.titulo)}</span>`:''} ${postre?`<span>\ud83c\udf6e ${esc(postre.titulo)}</span>`:''}</div></div><i class="ti ti-chevron-right card-arrow"></i></div></div>`;}).join('');
    return `<div class="index-section"><h3>${g.label}</h3>${rows}</div>`;
  }).join('');
}
function renderFridge(el){
  let res='';
  if(S.fridgeR===null){res=`<div class="empty"><i class="ti ti-basket"></i><p>Escribe los ingredientes que tienes<br>y encontramos la receta perfecta</p></div>`;}
  else if(S.fridgeR.length===0){res=`<div class="empty"><i class="ti ti-mood-sad"></i><p>Sin coincidencias.<br>Agrega m\u00e1s ingredientes e intenta de nuevo.</p></div>`;}
  else{
    const best=S.fridgeR[0].matchScore;
    let altSec='';
    if(!S.altMode&&best<0.35)altSec=`<div class="warn-box"><p style="font-size:14px;font-weight:700;margin-bottom:6px;color:#92400E">\u26a0\ufe0f Coincidencia baja</p><p style="font-size:13px;color:#78350F;margin-bottom:10px">Aqu\u00ed est\u00e1n las m\u00e1s cercanas. Tambi\u00e9n puedes ver alternativas con lo que tienes.</p><button class="btn-outline" onclick="S.altMode=true;render()">\u2728 Ver men\u00fa alternativo</button></div>`;
    if(S.altMode){const top=S.fridgeR.slice(0,3).map((m,i)=>`<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:${i<2?'1px solid #86EFAC':'none'}"><p style="font-size:14px;font-weight:700;margin-bottom:3px">${i+1}. ${esc(m.titulo)}</p><p style="font-size:12px;color:#166534">Tienes: ${m.matchedIngs.slice(0,4).join(', ')||'\u2014'}</p>${m.missingIngs.length?`<p style="font-size:12px;color:#991B1B">Necesitar\u00edas: ${m.missingIngs.slice(0,3).join(', ')}</p>`:''}<button class="btn-outline" onclick="openRecipe(${m.id})" style="font-size:12px;padding:5px 12px;margin-top:6px">Ver receta \u2192</button></div>`).join('');altSec=`<div class="alt-box"><p style="font-size:14px;font-weight:700;margin-bottom:12px;color:#14532D">\u2728 Men\u00fa alternativo con lo que tienes</p>${top}<button onclick="S.altMode=false;render()" style="background:none;border:none;font-size:12px;color:var(--muted);cursor:pointer;margin-top:4px">\u2190 Ver todos los resultados</button></div>`;}
    const rows=S.fridgeR.slice(0,12).map(m=>{const pct=Math.round(m.matchScore*100);const cls=pct>=60?'sh':pct>=30?'sm':'sl';return `<div class="recipe-card" onclick="openRecipe(${m.id})"><div class="recipe-card-inner" style="align-items:flex-start;gap:10px"><div class="score-badge ${cls}">${pct}%</div><div style="flex:1"><div class="card-title">${esc(m.titulo)}</div><div class="card-meta"><span style="color:#16A34A">\u2713 ${m.matchedIngs.slice(0,3).join(', ')||'\u2014'}${m.matchedIngs.length>3?' +m\u00e1s':''}</span></div>${m.missingIngs.length?`<div class="card-meta"><span style="color:#DC2626">\u2717 ${m.missingIngs.slice(0,3).join(', ')}${m.missingIngs.length>3?' +m\u00e1s':''}</span></div>`:''}</div><i class="ti ti-chevron-right card-arrow" style="margin-top:2px"></i></div></div>`;}).join('');
    res=`${altSec}<p style="font-size:13px;color:var(--muted);margin-bottom:10px">Mejores coincidencias:</p>${rows}`;
  }
  el.innerHTML=`<p class="fridge-label">\u00bfQu\u00e9 ingredientes tienes disponibles?</p><textarea id="fi" placeholder="Ej: pollo, cebolla, paprika, ajo, lim\u00f3n...">${esc(S.fridgeQ)}</textarea><p class="hint">Separa cada ingrediente con una coma</p><button class="btn-green" onclick="doFridgeSearch()"><i class="ti ti-search"></i> Buscar recetas con estos ingredientes</button>${res}`;
}
function renderRecipe(el){
  const m=S.selected;
  const base=m.servings||2;
  const ratio=S.servings/Math.max(base,1);
  const parsedIngs=m.ings.map(parseIng);
  const doneCount=Object.values(S.checked).filter(Boolean).length;
  const ings=parsedIngs.map((ing,i)=>{const done=!!S.checked[i];let disp=ing.scalable&&ratio!==1?`${fmtQ(ing.qty*ratio)}${ing.unit?' '+ing.unit:''} ${ing.name}`:ing.original;return `<div class="ing-row${done?' done':''}" onclick="toggleChk(${i})"><div class="chk${done?' done':''}"><i class="ti ti-check" style="font-size:11px;color:white;${done?'':'display:none'}"></i></div><span class="ing-text${done?' done':''}">${esc(disp)}</span></div>`;}).join('');
  const steps=m.pasos.map((s,i)=>`<div class="prep-step"><div class="step-num">${i+1}</div><div class="step-text">${esc(s)}</div></div>`).join('');
  const principal=MENUS.find(x=>x.num===m.num&&x.tipo==='Plato principal');
  const acomp=MENUS.find(x=>x.num===m.num&&x.tipo==='Acompa\u00f1amiento');
  const postre=MENUS.find(x=>x.num===m.num&&x.tipo==='Postre');
  const links=[principal&&m.id!==principal.id?`<button class="btn-outline" style="font-size:12px;padding:5px 12px" onclick="openRecipe(${principal.id})">\ud83c\udf7d ${esc(principal.titulo)}</button>`:'',acomp&&m.id!==acomp.id?`<button class="btn-outline" style="font-size:12px;padding:5px 12px" onclick="openRecipe(${acomp.id})">\ud83e\udd57 ${esc(acomp.titulo)}</button>`:'',postre&&m.id!==postre.id?`<button class="btn-outline" style="font-size:12px;padding:5px 12px" onclick="openRecipe(${postre.id})">\ud83c\udf6e ${esc(postre.titulo)}</button>`:''].filter(Boolean);
  const menuNav=links.length?`<div style="margin-bottom:16px"><p style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Men\u00fa ${m.num} completo:</p><div style="display:flex;flex-direction:column;gap:6px">${links.join('')}</div></div>`:'';
  el.innerHTML=`<div class="back-row" onclick="S.view='main';S.selected=null;render()"><i class="ti ti-arrow-left"></i> Volver</div>
<div class="recipe-hero"><div class="menu-num">MEN\u00da ${m.num} \u00b7 ${m.tipo.toUpperCase()}</div><div class="recipe-name">${esc(m.titulo)}</div><div class="time-chips"><span class="time-chip"><i class="ti ti-clock"></i> ${m.tiempo}</span><span class="time-chip">\ud83c\udf21 ${m.temp}</span>${m.cal?`<span class="time-chip">\ud83d\udd25 ${m.cal}</span>`:''}</div><div class="airfryer-box"><i class="ti ti-air-balloon" style="font-size:18px"></i> <strong>Air Fryer:</strong> ${m.airfryer} a ${m.temp}</div></div>
${menuNav}
<div class="serv-box"><i class="ti ti-users" style="font-size:22px;color:var(--green);flex-shrink:0"></i><div style="flex:1"><p style="font-size:13px;font-weight:600;color:var(--green2);margin-bottom:4px">Ajustar porciones</p><div class="serv-ctrl"><button class="serv-btn" onclick="adjS(-1)">\u2212</button><span class="serv-num">${S.servings}</span><button class="serv-btn plus" onclick="adjS(1)">+</button><span style="font-size:12px;color:var(--green2)">personas<br><span style="opacity:.7">(original: ${base})</span></span></div></div></div>
<div class="sec-title"><i class="ti ti-shopping-bag" style="color:var(--orange)"></i> Ingredientes ${doneCount>0?`<span style="font-size:12px;font-weight:400;color:var(--muted)">(${doneCount}/${m.ings.length})</span>`:''}</div>
<div class="card" style="margin-bottom:6px">${ings}</div>
<p style="font-size:11px;color:var(--muted);margin:-2px 0 16px">Toca cada ingrediente para marcarlo \u2713</p>
<div class="sec-title"><i class="ti ti-chef-hat" style="color:var(--orange)"></i> Preparaci\u00f3n paso a paso</div>
<div class="card" style="padding:14px;margin-bottom:16px">${steps}</div>
${m.cal?`<div class="nutr-box"><p style="font-size:13px;font-weight:600;color:var(--green)">\ud83e\udd57 Nutrici\u00f3n aproximada por porci\u00f3n</p><div class="nutr-grid"><div class="nutr-item"><p>${m.cal.replace(' kcal','')}</p><p>Calor\u00edas</p></div><div class="nutr-item"><p>${m.prot}</p><p>Prote\u00edna</p></div><div class="nutr-item"><p>${m.carb}</p><p>Carbohid.</p></div><div class="nutr-item"><p>${m.gras}</p><p>Grasas</p></div></div></div>`:''}
<div class="tip-box"><div class="tip-title"><i class="ti ti-bulb" style="color:#D97706"></i> Tips para que quede genial</div><div class="tip-item"><span style="color:#D97706;flex-shrink:0">&#9679;</span><span>${esc(m.tip)}</span></div>${m.consejo?`<div class="tip-item"><span style="color:#D97706;flex-shrink:0">&#9679;</span><span>${esc(m.consejo)}</span></div>`:''}<div class="tip-item"><span style="color:#D97706;flex-shrink:0">&#9679;</span><span>Precalienta la Air Fryer 3 minutos antes para mejores resultados.</span></div></div>
<button class="save-btn" onclick="saveRecipe()"><i class="ti ti-download"></i> Guardar esta receta sin internet</button>
<p style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:24px">Descarga un archivo HTML con la receta completa</p>`;
}
function setTab(t){S.tab=t;S.view='main';S.selectedPostre=null;render();}
function adjS(d){S.servings=Math.max(1,S.servings+d);render();}
function toggleChk(i){S.checked[i]=!S.checked[i];render();}
function openRecipe(id){const m=MENUS.find(x=>x.id===id);if(!m)return;S.selected=m;S.servings=m.servings||2;S.checked={};S.view='recipe';render();document.getElementById('content').scrollTop=0;}
function doSearch(){const inp=document.getElementById('si');S.searchQ=inp?inp.value:S.searchQ;if(!S.searchQ.trim())return;const q=norm(S.searchQ);S.searchR=MENUS.filter(m=>norm(m.titulo+' '+m.ings.join(' ')+' '+m.pasos.join(' ')).includes(q));render();}
function doFridgeSearch(){const inp=document.getElementById('fi');S.fridgeQ=inp?inp.value:S.fridgeQ;const my=S.fridgeQ.split(',').map(i=>norm(i.trim())).filter(Boolean);if(!my.length)return;const scored=MENUS.map(m=>{const txt=norm(m.ings.join(' ')+' '+m.titulo);const mat=my.filter(i=>txt.includes(i));const mis=my.filter(i=>!txt.includes(i));return{...m,matchScore:mat.length/my.length,matchedIngs:mat,missingIngs:mis};}).filter(m=>m.matchScore>0).sort((a,b)=>b.matchScore-a.matchScore);S.fridgeR=scored;S.altMode=false;render();}
function saveRecipe(){
  const m=S.selected;if(!m)return;
  const base=m.servings||2;const ratio=S.servings/Math.max(base,1);
  const parsedIngs=m.ings.map(ing=>{const cl=ing.replace(/^[\u2022\-\*\u00b7]\s*/,'').trim();const match=cl.match(/^(\d+(?:[,\.]\d+)?(?:\/\d+)?)\s*(tazas?|cucharadas?|cucharaditas?|cdas?\.?|cditas?\.?|kg|g|gr|ml|lts?|lb|oz|vasos?|unidades?)?\s*(?:de\s+)?(.+)/i);if(match&&ratio!==1){let q=match[1];if(q.includes('/'))q=parseFloat(q.split('/')[0])/parseFloat(q.split('/')[1]);else q=parseFloat(q.replace(',','.'));const r=Math.round(q*ratio*4)/4;const fmt=r===Math.floor(r)?Math.floor(r):r.toFixed(1);return `${fmt}${match[2]?' '+match[2]:''} ${match[3]}`;}return cl;});
  const content=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${m.titulo}</title><style>body{font-family:-apple-system,sans-serif;max-width:500px;margin:20px auto;padding:20px;background:#FAFAF7;color:#1a1a1a}h1{color:#2D5016;border-bottom:3px solid #4A7C2F;padding-bottom:8px;font-size:22px}h2{color:#C85C1E;margin:16px 0 8px;font-size:16px}.badge{background:#2D5016;color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block;margin-bottom:8px}.info{background:#F5F8F2;border-radius:8px;padding:12px;margin:12px 0;display:flex;gap:16px;flex-wrap:wrap}.info p{font-size:13px;color:#4A7C2F;margin:0}.ing-item{padding:8px;border-bottom:1px solid #E5E0D5;font-size:14px}.step{display:flex;gap:10px;margin-bottom:12px}.num{background:#C85C1E;color:white;border-radius:50%;width:24px;height:24px;min-width:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.step p{font-size:14px;line-height:1.5;margin:3px 0}.tip{background:#FFFBEB;border:1px solid #FCD34D;border-radius:8px;padding:12px;margin:12px 0;font-size:13px;color:#78350F}.credit{text-align:center;color:#7A7060;font-size:12px;margin-top:24px;font-style:italic;padding-top:16px;border-top:1px solid #E5E0D5}</style></head><body><span class="badge">MEN\u00da ${m.num} \u00b7 ${m.tipo}</span><h1>${m.titulo}</h1><div class="info"><p>\u23f1 ${m.tiempo}</p><p>\ud83c\udf21 ${m.temp}</p><p>\ud83d\udc65 ${S.servings} personas</p>${m.cal?`<p>\ud83d\udd25 ${m.cal}</p>`:''}</div><h2>Ingredientes</h2>${parsedIngs.map(i=>`<div class="ing-item">\u2022 ${i}</div>`).join('')}<h2>Preparaci\u00f3n</h2>${m.pasos.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><p>${s}</p></div>`).join('')}<div class="tip">\ud83d\udca1 <strong>Tip del chef:</strong> ${m.tip}${m.consejo?`<br><br>\u2b50 ${m.consejo}`:''}</div><div class="credit">Chef Creativo \u00b7 Recetas Air Fryer \u2665</div></body></html>`;
  const a=document.createElement('a');a.href='data:text/html;charset=utf-8,'+encodeURIComponent(content);a.download=m.titulo.replace(/[^a-z0-9]/gi,'_')+'.html';a.click();
}
function renderPostres(el){
  const cats=[...new Set(POSTRES.map(p=>p.categoria))];
  let html='';
  for(const cat of cats){
    const items=POSTRES.filter(p=>p.categoria===cat);
    html+=`<div class="index-section"><h3>${esc(cat)}</h3>`;
    html+=items.map(p=>`<div class="postre-card" onclick="openPostre(${p.id})">
      <div class="recipe-card-inner">
        <div style="font-size:32px;flex-shrink:0">${p.emoji}</div>
        <div style="flex:1">
          <div class="card-title">${esc(p.titulo)}</div>
          <div class="card-meta"><span style="color:#C2185B">${esc(p.categoria)}</span><span>⏱ ${p.tiempo}</span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(p.desc)}</div>
        </div>
        <i class="ti ti-chevron-right card-arrow"></i>
      </div>
    </div>`).join('');
    html+='</div>';
  }
  el.innerHTML=`<div style="margin-bottom:14px"><p style="font-size:13px;color:var(--muted)">🎁 <strong>Bono exclusivo</strong> — 20 postres irresistibles</p></div>${html}`;
}

function openPostre(id){
  const p=POSTRES.find(x=>x.id===id);
  if(!p)return;
  S.selectedPostre=p;
  S.checked={};
  render();
  document.getElementById('content').scrollTop=0;
}

function renderPostreDetail(el){
  const p=S.selectedPostre;
  const ings=p.ings.map((ing,i)=>{
    const done=!!S.checked[i];
    return `<div class="ing-row${done?' done':''}" onclick="toggleChk(${i})">
      <div class="chk${done?' done':''}"><i class="ti ti-check" style="font-size:11px;color:white;${done?'':'display:none'}"></i></div>
      <span class="ing-text${done?' done':''}">${esc(ing)}</span>
    </div>`;
  }).join('');
  const steps=p.pasos.map((s,i)=>`<div class="prep-step"><div class="step-num" style="background:linear-gradient(135deg,#7B2D8B,#C2185B)">${i+1}</div><div class="step-text">${esc(s)}</div></div>`).join('');

  <div class="postre-hero">
    <div style="font-size:11px;font-weight:600;opacity:.8;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px">🎁 BONO · ${esc(p.categoria)}</div>
    <div style="font-size:28px;margin-bottom:6px">${p.emoji}</div>
    <div style="font-size:20px;font-weight:800;line-height:1.2;margin-bottom:12px">${esc(p.titulo)}</div>
    <div class="time-chips">
      <span class="time-chip"><i class="ti ti-clock"></i> ${p.tiempo}</span>
      <span class="time-chip"><i class="ti ti-users"></i> ${p.servings} pers.</span>
    </div>
    <div style="background:rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px">${esc(p.desc)}</div>
  </div>

  <div class="sec-title"><i class="ti ti-shopping-bag" style="color:#C2185B"></i> Ingredientes ${doneCount>0?`<span style="font-size:12px;font-weight:400;color:var(--muted)">(${doneCount}/${p.ings.length})</span>`:''}</div>
  <div class="card" style="margin-bottom:6px">${ings}</div>
  <p style="font-size:11px;color:var(--muted);margin:-2px 0 16px">Toca cada ingrediente para marcarlo ✓</p>

  <div class="sec-title"><i class="ti ti-chef-hat" style="color:#C2185B"></i> Preparación paso a paso</div>
  <div class="card" style="padding:14px;margin-bottom:16px">${steps}</div>

  <div style="background:linear-gradient(135deg,#FDF2FF,#FCE4EC);border:1px solid #E1BEE7;border-radius:14px;padding:14px;margin-bottom:16px">
    <div style="font-size:14px;font-weight:700;color:#6A1B9A;margin-bottom:10px;display:flex;align-items:center;gap:6px"><i class="ti ti-bulb" style="color:#AB47BC"></i> Tips para que quede perfecto</div>
    <div class="tip-item" style="color:#4A148C"><span style="color:#AB47BC;flex-shrink:0">●</span><span>${esc(p.tip)}</span></div>
    ${p.consejo?`<div class="tip-item" style="color:#4A148C"><span style="color:#AB47BC;flex-shrink:0">●</span><span>${esc(p.consejo)}</span></div>`:''}
  </div>

  <button class="save-btn" style="background:linear-gradient(135deg,#7B2D8B,#C2185B)" onclick="savePostre()"><i class="ti ti-download"></i> Guardar este postre sin internet</button>
  <p style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:24px">Descarga un archivo HTML con la receta completa</p>`;
}

function savePostre(){
  const p=S.selectedPostre;if(!p)return;
  const content=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${p.titulo}</title><style>body{font-family:-apple-system,sans-serif;max-width:500px;margin:20px auto;padding:20px;background:#FDF2FF;color:#1a1a1a}h1{color:#6A1B9A;border-bottom:3px solid #C2185B;padding-bottom:8px;font-size:20px}h2{color:#C2185B;margin:16px 0 8px;font-size:16px}.badge{background:#7B2D8B;color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:inline-block;margin-bottom:8px}.info{background:#F3E5F5;border-radius:8px;padding:12px;margin:12px 0;display:flex;gap:16px;flex-wrap:wrap}.info p{font-size:13px;color:#6A1B9A;margin:0}.ing-item{padding:8px;border-bottom:1px solid #E1BEE7;font-size:14px}.step{display:flex;gap:10px;margin-bottom:12px}.num{background:#C2185B;color:white;border-radius:50%;width:24px;height:24px;min-width:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.step p{font-size:14px;line-height:1.5;margin:3px 0}.tip{background:#FDF2FF;border:1px solid #CE93D8;border-radius:8px;padding:12px;margin:12px 0;font-size:13px;color:#4A148C}.credit{text-align:center;color:#9E9E9E;font-size:12px;margin-top:24px;font-style:italic;padding-top:16px;border-top:1px solid #E1BEE7}</style></head><body><span class="badge">${p.emoji} BONO · ${p.categoria}</span><h1>${p.titulo}</h1><div class="info"><p>\u23f1 ${p.tiempo}</p><p>\ud83d\udc65 ${p.servings} personas</p></div><h2>Ingredientes</h2>${p.ings.map(i=>`<div class="ing-item">\u2022 ${i}</div>`).join('')}<h2>Preparaci\u00f3n</h2>${p.pasos.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><p>${s}</p></div>`).join('')}<div class="tip">\ud83d\udca1 <strong>Tip del chef:</strong> ${p.tip}${p.consejo?`<br><br>\u2b50 ${p.consejo}`:''}</div><div class="credit">Chef Creativo \u00b7 20 Postres Irresistibles \u2665</div></body></html>`;
  const a=document.createElement('a');a.href='data:text/html;charset=utf-8,'+encodeURIComponent(content);a.download=p.titulo.replace(/[^a-z0-9]/gi,'_')+'.html';a.click();
}

render();
</script>
