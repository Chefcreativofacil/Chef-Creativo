<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FAFAF7;color:#1a1a1a;min-height:100vh}
:root{--green:#2D5016;--green2:#4A7C2F;--orange:#C85C1E;--orange2:#E8834A;--gold:#B8860B;--bg:#FAFAF7;--surface:#fff;--border:#E5E0D5;--muted:#7A7060;--shadow:0 2px 12px rgba(0,0,0,.08)}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,var(--green) 0%,var(--green2) 100%);color:white;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-icon{font-size:26px;flex-shrink:0}
.header h1{font-size:17px;font-weight:700;line-height:1.2}
.header .sub{font-size:11px;opacity:.8;margin-top:1px}
.header-by{font-size:10px;opacity:.7;margin-top:2px;font-style:italic}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:54px;z-index:100}
.tab{flex:1;padding:11px 6px;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.tab.active{color:var(--green);border-bottom-color:var(--green);background:#F5F8F2}
.content{flex:1;padding:14px;overflow-y:auto}
.search-wrap{display:flex;gap:8px;margin-bottom:14px}
.search-wrap input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;background:var(--surface);color:#1a1a1a;outline:none}
.search-wrap input:focus{border-color:var(--green)}
.search-btn{padding:11px 16px;background:var(--green);color:white;border:none;border-radius:12px;cursor:pointer;font-size:18px;display:flex;align-items:center;flex-shrink:0}
.recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;cursor:pointer;transition:transform .1s;box-shadow:var(--shadow)}
.recipe-card:active{transform:scale(.98)}
.recipe-card-inner{display:flex;align-items:center;gap:12px;padding:12px 14px}
.menu-badge{min-width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green2));color:white;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.2}
.menu-badge span{font-size:14px}
.card-title{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:2px;line-height:1.3}
.card-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.card-arrow{color:var(--muted);font-size:18px;flex-shrink:0;margin-left:auto}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty i{font-size:44px;opacity:.25;display:block;margin-bottom:12px}
.fridge-label{font-size:14px;color:#374151;margin-bottom:8px;font-weight:500}
textarea{width:100%;min-height:80px;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;resize:none;color:#1a1a1a;background:var(--surface);outline:none;line-height:1.5}
textarea:focus{border-color:var(--green)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
.btn-green{width:100%;padding:13px;background:linear-gradient(135deg,var(--green),var(--green2));color:white;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
.score-badge{min-width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.sh{background:#DCFCE7;color:#14532D}.sm{background:#FEF9C3;color:#713F12}.sl{background:#FEE2E2;color:#7F1D1D}
.alt-box{background:#F0FDF4;border:1px solid #86EFAC;border-radius:12px;padding:14px;margin-bottom:14px}
.warn-box{background:#FFFBEB;border:1px solid #FCD34D;border-radius:12px;padding:14px;margin-bottom:14px}
.btn-outline{background:transparent;color:var(--green);border:1.5px solid var(--green);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-top:8px}
.back-row{display:flex;align-items:center;gap:8px;padding:10px 0 14px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500}
.recipe-hero{background:linear-gradient(135deg,var(--green) 0%,var(--green2) 100%);border-radius:16px;padding:18px;color:white;margin-bottom:18px;position:relative;overflow:hidden}
.recipe-hero::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.07)}
.menu-num{font-size:11px;font-weight:600;opacity:.8;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.recipe-name{font-size:21px;font-weight:800;line-height:1.2;margin-bottom:12px}
.time-chips{display:flex;gap:8px;flex-wrap:wrap}
.time-chip{background:rgba(255,255,255,.18);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px}
.airfryer-box{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px}
.serv-box{background:#F5F8F2;border:1px solid #C8DDB8;border-radius:14px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.serv-ctrl{display:flex;align-items:center;gap:12px;margin-top:6px}
.serv-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--green);background:var(--surface);color:var(--green);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:500}
.serv-btn.plus{background:var(--green);color:white}
.serv-num{font-size:26px;font-weight:800;color:var(--green);min-width:36px;text-align:center}
.sec-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:#1a1a1a}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.ing-row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.ing-row:last-child{border-bottom:none}
.ing-row.done{background:#F0FFF4}
.chk{width:22px;height:22px;min-width:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s}
.chk.done{background:var(--green);border-color:var(--green)}
.ing-text{font-size:14px;line-height:1.4;color:#1a1a1a}
.ing-text.done{text-decoration:line-through;color:var(--muted)}
.prep-step{display:flex;gap:12px;margin-bottom:14px}
.step-num{min-width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange2));color:white;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-text{font-size:14px;line-height:1.6;color:#1a1a1a}
.tip-box{background:linear-gradient(135deg,#FFFBEB,#FFF8E1);border:1px solid #FCD34D;border-radius:14px;padding:14px;margin-bottom:16px}
.tip-title{font-size:14px;font-weight:700;color:#92400E;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.tip-item{font-size:13px;color:#78350F;line-height:1.5;margin-bottom:7px;display:flex;gap:7px}
.nutr-box{background:#F5F8F2;border:1px solid #C8DDB8;border-radius:14px;padding:14px;margin-bottom:16px}
.nutr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:8px}
.nutr-item p:first-child{font-size:15px;font-weight:700;color:var(--green)}
.nutr-item p:last-child{font-size:10px;color:var(--muted)}
.save-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#D4A017);color:white;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.index-section{margin-bottom:20px}
.index-section h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;padding:0 2px}
.postre-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s}
.postre-card:active{transform:scale(.98)}
.cat-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#FFF0E8;color:var(--orange);margin-bottom:6px}
.postre-hero{background:linear-gradient(135deg,#7B2D8B 0%,#C2185B 100%);border-radius:16px;padding:18px;color:white;margin-bottom:18px;position:relative;overflow:hidden}
.postre-hero::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.07)}
</style>
</head>

<script>
const MENUS=[
{id:1,num:1,titulo:"Pollo Crispy con Miel y Mostaza",tipo:"Plato principal",tiempo:"25 min",prep:"10 min",airfryer:"15+5 min",temp:"180°C",cal:"320 kcal",prot:"35g",carb:"8g",gras:"14g",servings:2,ings:["2 pechugas de pollo","2 cdas de miel","1 cda de mostaza","1 diente de ajo picado","1 cda de aceite de oliva","1/2 cdta de paprika","Sal y pimienta al gusto"],pasos:["Mezcla miel, mostaza, ajo, aceite, paprika, sal y pimienta.","Unta el pollo por ambos lados con la mezcla.","Coloca las pechugas en la Air Fryer sin encimarlas.","Cocina a 180°C por 15 minutos. Voltea y cocina 5 minutos más.","Deja reposar 3 minutos antes de servir."],tip:"Pincela un poco más de salsa durante los últimos 3 minutos para más brillo y sabor.",consejo:"No sobrecargues la canasta para que el pollo quede más dorado y crujiente."},
{id:2,num:1,titulo:"Papas Hasselback con Romero",tipo:"Acompañamiento",tiempo:"30 min",prep:"5 min",airfryer:"20-25 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 papas medianas","1 cda de aceite de oliva","1 diente de ajo en polvo","Romero fresco","Sal y pimienta al gusto"],pasos:["Lava bien las papas y haz cortes finos sin llegar a la base.","Mezcla el aceite, ajo, sal, pimienta y romero.","Unta las papas con la mezcla.","Cocina a 190°C por 20-25 minutos hasta que estén doradas y tiernas."],tip:"Sirve con una cucharada de yogur natural o crema agria.",consejo:""},
{id:3,num:1,titulo:"Brownie de Chocolate en Air Fryer",tipo:"Postre",tiempo:"30 min",prep:"10 min",airfryer:"18-20 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:4,ings:["1/2 taza de harina","1/2 taza de azúcar","1/4 taza de cocoa","1/4 taza de mantequilla derretida","1 huevo","1/2 cdta de vainilla","Chispas de chocolate al gusto"],pasos:["Mezcla la mantequilla con el azúcar, huevo y vainilla.","Agrega la harina y la cocoa.","Incorpora las chispas de chocolate.","Vierte la mezcla en un molde apto para Air Fryer.","Cocina a 160°C por 18-20 minutos y deja enfriar antes de cortar."],tip:"Acompaña con helado de vainilla para un toque irresistible.",consejo:""},
{id:4,num:2,titulo:"Alitas BBQ Doradas",tipo:"Plato principal",tiempo:"35 min",prep:"10 min",airfryer:"25 min",temp:"190°C",cal:"390 kcal",prot:"28g",carb:"14g",gras:"24g",servings:2,ings:["8 alitas de pollo partidas, limpias y secas","1 cda de aceite","1/2 cdta de paprika","1/2 cdta de ajo en polvo","1/2 cdta de sal","Pimienta al gusto","4 cdas de salsa BBQ"],pasos:["Seca muy bien las alitas con papel de cocina.","Mezcla aceite, paprika, ajo en polvo, sal y pimienta.","Unta las alitas con la mezcla por todos los lados.","Cocina en Air Fryer a 190°C por 20 minutos, volteando a mitad de cocción.","Barniza con salsa BBQ y cocina 5 minutos más hasta que estén doradas."],tip:"Para que queden más crujientes, seca muy bien las alitas antes de sazonarlas.",consejo:"Si quieres un sabor más intenso, agrega una segunda capa ligera de salsa BBQ al final."},
{id:5,num:2,titulo:"Mazorquitas con Mantequilla de Ajo",tipo:"Acompañamiento",tiempo:"20 min",prep:"5 min",airfryer:"12-15 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 mazorcas tiernas partidas en mitades","1 cda de mantequilla derretida","1 diente de ajo finamente picado","1 cda de queso rallado","Sal al gusto","Perejil o cilantro picado opcional"],pasos:["Mezcla la mantequilla derretida con ajo y sal.","Unta las mazorcas con la mezcla por todos los lados.","Cocina en Air Fryer a 190°C por 12 a 15 minutos.","Sirve con queso rallado y perejil o cilantro al gusto."],tip:"Si las mazorcas están muy grandes, pártelas en trozos para que se cocinen mejor.",consejo:""},
{id:6,num:2,titulo:"Galletas de Avena y Chocolate",tipo:"Postre",tiempo:"20 min",prep:"10 min",airfryer:"8-10 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:8,ings:["1/2 taza de avena en hojuelas","1/4 taza de harina de trigo","2 cdas de azúcar o panela pulverizada","1 huevo pequeño","2 cdas de mantequilla derretida","1/4 cdta de esencia de vainilla","2 cdas de chips de chocolate"],pasos:["Mezcla avena, harina, azúcar, huevo, mantequilla y vainilla.","Agrega los chips de chocolate y mezcla suavemente.","Forma bolitas pequeñas y aplánalas un poco.","Cocina en Air Fryer a 160°C por 8 a 10 minutos.","Deja enfriar antes de servir para que tomen mejor textura."],tip:"Déjalas reposar 5 minutos después de cocinar; al salir pueden estar blandas pero se afirman.",consejo:""},
{id:7,num:3,titulo:"Chuleta de Cerdo Apanada",tipo:"Plato principal",tiempo:"30 min",prep:"10 min",airfryer:"18-20 min",temp:"190°C",cal:"410 kcal",prot:"32g",carb:"22g",gras:"21g",servings:2,ings:["2 chuletas de cerdo medianas de 1 a 1.5 cm de grosor","1 huevo batido","1/2 taza de miga de pan o panko","2 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","Aceite en spray o 1 cdta de aceite"],pasos:["Sazona las chuletas con sal, pimienta, ajo en polvo y paprika.","Pasa cada chuleta por harina, luego por huevo batido y finalmente por miga de pan.","Presiona suavemente el apanado para que se adhiera bien.","Cocina en Air Fryer a 190°C por 9 minutos por cada lado.","Revisa que estén doradas y bien cocidas antes de servir."],tip:"Para un apanado más crujiente, rocía un poco de aceite sobre las chuletas antes de cocinarlas.",consejo:"No uses chuletas demasiado gruesas para que queden bien doradas por fuera."},
{id:8,num:3,titulo:"Bastones de Yuca Crujiente",tipo:"Acompañamiento",tiempo:"25 min",prep:"5 min",airfryer:"15-18 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["300 g de yuca pelada y cocida","1 cda de aceite","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal al gusto","Perejil o cilantro picado opcional"],pasos:["Corta la yuca cocida en bastones medianos.","Mezcla con aceite, ajo en polvo, paprika y sal.","Cocina en Air Fryer a 190°C por 15-18 minutos.","Voltea a mitad de cocción y sirve dorada."],tip:"La yuca debe estar cocida pero firme para que no se deshaga al cortarla.",consejo:""},
{id:9,num:3,titulo:"Mini Muffins de Banano",tipo:"Postre",tiempo:"25 min",prep:"10 min",airfryer:"12-15 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:6,ings:["1 banano maduro grande triturado","1 huevo","1/4 taza de harina de trigo","2 cdas de azúcar o panela pulverizada","1 cda de aceite o mantequilla derretida","1/4 cdta de polvo de hornear","1/4 cdta de esencia de vainilla","Canela al gusto opcional"],pasos:["Mezcla el banano triturado con huevo, azúcar, aceite y vainilla.","Agrega harina, polvo de hornear y canela.","Vierte la mezcla en moldes pequeños aptos para Air Fryer.","Cocina a 160°C por 12-15 minutos.","Deja enfriar antes de desmoldar."],tip:"Usa un banano bien maduro para que los muffins queden más dulces y suaves.",consejo:""},
{id:10,num:4,titulo:"Salmón Glaseado con Limón y Miel",tipo:"Plato principal",tiempo:"20 min",prep:"8 min",airfryer:"10-12 min",temp:"180°C",cal:"340 kcal",prot:"30g",carb:"9g",gras:"20g",servings:2,ings:["2 filetes de salmón de 120 a 150 g cada uno","1 cda de miel","1 cda de jugo de limón","1 cdta de aceite de oliva","1/2 cdta de ajo en polvo","Sal y pimienta al gusto","Ralladura de limón opcional"],pasos:["Mezcla miel, jugo de limón, aceite, ajo en polvo, sal y pimienta.","Seca los filetes de salmón con papel de cocina.","Unta el salmón con la mezcla por la parte superior.","Cocina en Air Fryer a 180°C por 10 a 12 minutos.","Sirve con ralladura de limón si deseas más aroma."],tip:"No cocines demasiado el salmón para que conserve su textura jugosa y suave.",consejo:"El salmón está listo cuando se separa fácilmente con un tenedor."},
{id:11,num:4,titulo:"Habichuelas Crocantes con Ajo",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["250 g de habichuelas frescas limpias y sin puntas","1 cdta de aceite de oliva","1 diente de ajo finamente picado","1 cda de queso parmesano rallado opcional","Sal y pimienta al gusto","Gotas de limón opcional"],pasos:["Mezcla las habichuelas con aceite, ajo, sal y pimienta.","Colócalas en la Air Fryer sin amontonarlas demasiado.","Cocina a 180°C por 8 a 10 minutos.","Sirve con queso rallado o unas gotas de limón."],tip:"Si prefieres una textura más suave, cocínalas 2 minutos más.",consejo:""},
{id:12,num:4,titulo:"Manzanas Asadas con Canela",tipo:"Postre",tiempo:"20 min",prep:"5 min",airfryer:"10-12 min",temp:"170°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 manzanas rojas medianas","1 cda de miel o panela pulverizada","1/2 cdta de canela en polvo","1 cdta de mantequilla derretida","2 cdas de avena en hojuelas","1 cda de nueces picadas opcional"],pasos:["Parte las manzanas por la mitad y retira el centro.","Mezcla avena, miel, canela, mantequilla y nueces.","Rellena las manzanas con la mezcla.","Cocina en Air Fryer a 170°C por 10 a 12 minutos.","Sirve tibias."],tip:"Usa manzanas firmes para que mantengan su forma durante la cocción.",consejo:""},
{id:13,num:5,titulo:"Hamburguesa Casera Jugosa",tipo:"Plato principal",tiempo:"25 min",prep:"10 min",airfryer:"12-15 min",temp:"180°C",cal:"520 kcal",prot:"32g",carb:"38g",gras:"28g",servings:2,ings:["300 g de carne molida de res","2 panes para hamburguesa","2 tajadas de queso","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","2 hojas de lechuga","2 rodajas de tomate","Salsa al gusto"],pasos:["Mezcla la carne molida con ajo en polvo, paprika, sal y pimienta.","Forma 2 hamburguesas medianas del mismo grosor.","Cocina en Air Fryer a 180°C por 10 a 12 minutos.","Agrega el queso encima y cocina 1 a 2 minutos más.","Arma las hamburguesas con pan, lechuga, tomate y salsa al gusto."],tip:"Haz una pequeña presión en el centro de cada carne antes de cocinarla para que mantenga mejor su forma.",consejo:"No presiones la carne mientras se cocina para conservar sus jugos."},
{id:14,num:5,titulo:"Papas Rústicas Especiadas",tipo:"Acompañamiento",tiempo:"30 min",prep:"5 min",airfryer:"20-25 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 papas medianas","1 cda de aceite","1/2 cdta de paprika","1/2 cdta de ajo en polvo","1/2 cdta de orégano seco","Sal y pimienta al gusto","Perejil o cilantro picado opcional"],pasos:["Lava las papas y córtalas en cascos medianos.","Mezcla las papas con aceite, paprika, ajo, orégano, sal y pimienta.","Cocina en Air Fryer a 190°C por 20 a 25 minutos.","Voltea a mitad de cocción y sirve doradas."],tip:"Para que queden más crujientes, seca bien las papas antes de sazonarlas.",consejo:""},
{id:15,num:5,titulo:"Donas Rápidas en Air Fryer",tipo:"Postre",tiempo:"20 min",prep:"10 min",airfryer:"8-10 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:6,ings:["1 taza de harina de trigo","2 cdas de azúcar","1 cdta de polvo de hornear","1/4 taza de leche","1 huevo pequeño","1 cda de mantequilla derretida","1/2 cdta de esencia de vainilla","Azúcar y canela para decorar"],pasos:["Mezcla harina, azúcar y polvo de hornear.","Agrega leche, huevo, mantequilla y vainilla hasta formar una masa suave.","Forma donas pequeñas y colócalas en papel para hornear.","Cocina en Air Fryer a 160°C por 8 a 10 minutos.","Pasa las donas por azúcar con canela mientras estén tibias."],tip:"No hagas las donas muy grandes para que se cocinen bien por dentro.",consejo:""},
{id:16,num:6,titulo:"Nuggets Caseros de Pollo",tipo:"Plato principal",tiempo:"30 min",prep:"15 min",airfryer:"12-15 min",temp:"190°C",cal:"360 kcal",prot:"34g",carb:"24g",gras:"14g",servings:2,ings:["1 pechuga de pollo completa en cubos medianos","1 huevo batido","1/2 taza de miga de pan o panko","2 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","Aceite en spray"],pasos:["Corta la pechuga en cubos medianos y sazona con sal, pimienta, ajo en polvo y paprika.","Pasa cada cubo por harina, luego por huevo batido y finalmente por miga de pan o panko.","Presiona suavemente el apanado para que se adhiera bien.","Coloca los nuggets en la Air Fryer sin encimarlos y rocía un poco de aceite.","Cocina a 190°C por 12-15 minutos, volteando a mitad de cocción."],tip:"Para que queden más crujientes, usa panko y seca bien el pollo antes de apanarlo.",consejo:"Acompáñalos con salsa de yogur, miel mostaza o BBQ."},
{id:17,num:6,titulo:"Chips de Plátano Maduro",tipo:"Acompañamiento",tiempo:"15 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 plátano maduro firme no demasiado blando","1 cdta de aceite","1 pizca de sal","Canela opcional","Queso rallado opcional para servir"],pasos:["Pela el plátano maduro y córtalo en tajadas delgadas.","Mezcla las tajadas con aceite y una pizca de sal.","Colócalas en la Air Fryer sin encimarlas.","Cocina a 180°C por 8-10 minutos, volteando a mitad de cocción.","Retira cuando estén doradas, sin dejarlas quemar."],tip:"Usa un plátano maduro firme. Si está muy blando puede pegarse o deshacerse.",consejo:""},
{id:18,num:6,titulo:"Mini Cheesecake de Frutos Rojos",tipo:"Postre",tiempo:"25 min",prep:"10 min",airfryer:"8-10 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:4,ings:["4 galletas dulces tipo María trituradas","1 cda de mantequilla derretida","1/2 taza de queso crema","2 cdas de yogur natural o griego","1 huevo pequeño","2 cdas de azúcar","1/4 cdta de esencia de vainilla","2 cdas de mermelada o salsa de frutos rojos"],pasos:["Mezcla las galletas trituradas con mantequilla y ponlas en moldes pequeños.","Bate queso crema, yogur, huevo, azúcar y vainilla hasta integrar.","Vierte la mezcla sobre la base de galleta.","Cocina en Air Fryer a 160°C por 8-10 minutos.","Enfría y decora con frutos rojos o mermelada antes de servir."],tip:"No llenes los moldes hasta el borde para que se cocine de forma pareja.",consejo:""},
{id:19,num:7,titulo:"Camarones Apanados Crujientes",tipo:"Plato principal",tiempo:"25 min",prep:"12 min",airfryer:"8-10 min",temp:"180°C",cal:"310 kcal",prot:"28g",carb:"26g",gras:"10g",servings:2,ings:["250 g de camarones limpios pelados y desvenados","1 huevo batido","1/2 taza de miga de pan o panko","2 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","Aceite en spray","Limón para servir opcional"],pasos:["Seca muy bien los camarones con papel de cocina.","Sazona con sal, pimienta, ajo en polvo y paprika.","Pasa cada camarón por harina, luego por huevo batido y finalmente por panko.","Coloca los camarones en la Air Fryer sin encimarlos y rocía un poco de aceite.","Cocina a 180°C por 8-10 minutos, volteando a mitad de cocción."],tip:"Usa panko y evita cocinar demasiado los camarones porque pueden ponerse duros.",consejo:"Sírvelos con limón o una salsa cremosa suave."},
{id:20,num:7,titulo:"Vegetales Rostizados",tipo:"Acompañamiento",tiempo:"20 min",prep:"5 min",airfryer:"10-12 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1/2 zucchini mediano en rodajas","1/2 pimentón rojo en tiras","1/2 cebolla cabezona en trozos","1 zanahoria pequeña en bastones","1 cda de aceite de oliva","1/2 cdta de ajo en polvo","Sal y pimienta al gusto"],pasos:["Corta los vegetales en tamaños similares para que se cocinen parejo.","Mezcla con aceite, ajo en polvo, sal y pimienta.","Coloca en la Air Fryer sin amontonar demasiado.","Cocina a 180°C por 10-12 minutos, moviendo a mitad de cocción."],tip:"No cortes los vegetales demasiado pequeños para evitar que se quemen.",consejo:""},
{id:21,num:7,titulo:"Galletas de Mantequilla",tipo:"Postre",tiempo:"20 min",prep:"10 min",airfryer:"7-9 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:8,ings:["1/2 taza de harina de trigo","3 cdas de mantequilla a temperatura ambiente","2 cdas de azúcar pulverizada","1/4 cdta de esencia de vainilla","1 pizca de sal","1 cda de leche si la masa queda seca"],pasos:["Mezcla la mantequilla con el azúcar hasta integrar bien.","Agrega vainilla, sal y harina poco a poco.","Forma bolitas pequeñas y aplánalas suavemente.","Cocina en Air Fryer a 160°C por 7-9 minutos.","Deja enfriar antes de servir para que tomen mejor textura."],tip:"Al salir pueden sentirse blandas, pero se endurecen un poco al enfriar. No las dejes quemar.",consejo:""},
{id:22,num:8,titulo:"Pechuga Rellena de Queso y Espinaca",tipo:"Plato principal",tiempo:"35 min",prep:"15 min",airfryer:"18-20 min",temp:"180°C",cal:"380 kcal",prot:"42g",carb:"4g",gras:"21g",servings:2,ings:["1 pechuga de pollo entera en 2 filetes gruesos","1/2 taza de espinaca fresca picada","1/2 taza de queso mozzarella rallado","2 cdas de queso crema opcional","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","1 cdta de aceite para pincelar","Palillos para cerrar"],pasos:["Abre cada filete de pechuga por un lado formando un bolsillo sin cortarlo por completo.","Mezcla la espinaca con el queso mozzarella y el queso crema.","Rellena cada filete con la mezcla y cierra con palillos.","Sazona por fuera con sal, pimienta, ajo en polvo, paprika y aceite.","Cocina en Air Fryer a 180°C por 18-20 minutos, volteando a mitad de cocción."],tip:"No rellenes demasiado la pechuga para evitar que el queso se salga durante la cocción.",consejo:"Antes de servir, deja reposar 3 minutos para que el queso se mantenga cremoso."},
{id:23,num:8,titulo:"Champiñones al Ajo",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["250 g de champiñones frescos limpios en mitades","1 cda de aceite de oliva","1 diente de ajo finamente picado","1/2 cdta de orégano seco","Sal y pimienta al gusto","Perejil o cilantro picado opcional"],pasos:["Mezcla los champiñones con aceite, ajo, orégano, sal y pimienta.","Colócalos en la Air Fryer sin amontonarlos demasiado.","Cocina a 180°C por 8-10 minutos, moviendo a mitad de cocción.","Sirve con perejil o cilantro picado al gusto."],tip:"No laves los champiñones con demasiada agua. Límplalos con un paño húmedo.",consejo:""},
{id:24,num:8,titulo:"Tostadas Dulces de Canela",tipo:"Postre",tiempo:"15 min",prep:"5 min",airfryer:"5-7 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 tajadas de pan tajado","1 cda de mantequilla derretida","1 cda de azúcar","1/2 cdta de canela en polvo","1/4 cdta de esencia de vainilla opcional","Miel o leche condensada opcional para servir"],pasos:["Mezcla la mantequilla derretida con azúcar, canela y vainilla.","Unta las tajadas de pan por ambos lados con la mezcla.","Corta cada tajada en triángulos o bastones si deseas.","Cocina en Air Fryer a 160°C por 5-7 minutos, hasta que estén doradas.","Sirve tibias con un toque de miel si deseas."],tip:"Revisa las tostadas desde el minuto 5, porque el pan se dora rápido y puede quemarse.",consejo:""},
{id:25,num:9,titulo:"Costillitas BBQ Caramelizadas",tipo:"Plato principal",tiempo:"40 min",prep:"10 min",airfryer:"25-30 min",temp:"180°C",cal:"480 kcal",prot:"32g",carb:"18g",gras:"32g",servings:2,ings:["500 g de costillitas de cerdo en porciones pequeñas","1 cda de aceite","1/2 cdta de ajo en polvo","1/2 cdta de paprika","1/2 cdta de sal","Pimienta al gusto","4 cdas de salsa BBQ","1 cda de miel o panela derretida opcional"],pasos:["Seca las costillitas con papel de cocina y sazónalas con aceite, ajo, paprika, sal y pimienta.","Colócalas en la Air Fryer sin amontonarlas demasiado.","Cocina a 180°C por 20 minutos, volteando a mitad de cocción.","Mezcla la salsa BBQ con miel o panela y barniza las costillitas.","Cocina 5-10 minutos más hasta que estén doradas y caramelizadas."],tip:"Barniza las costillitas solo al final para evitar que la salsa BBQ se queme.",consejo:"Si las costillitas son muy gruesas, cocínalas unos minutos más."},
{id:26,num:9,titulo:"Papas Criollas Doradas",tipo:"Acompañamiento",tiempo:"28 min",prep:"5 min",airfryer:"18-22 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["300 g de papa criolla lavada","1 cda de aceite","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","Perejil o cilantro picado opcional"],pasos:["Lava bien las papas criollas y sécalas con papel de cocina.","Mézclalas con aceite, ajo en polvo, paprika, sal y pimienta.","Colócalas en la Air Fryer sin amontonarlas demasiado.","Cocina a 190°C por 18-22 minutos, moviendo a mitad de cocción."],tip:"Si las papas criollas están muy grandes, pártelas a la mitad para que se cocinen mejor.",consejo:""},
{id:27,num:9,titulo:"Banano con Chocolate Derretido",tipo:"Postre",tiempo:"12 min",prep:"5 min",airfryer:"5-7 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 bananos maduros firmes","4 cuadritos de chocolate semiamargo o de leche","1 cdta de mantequilla opcional","1 cda de maní o nueces picadas opcional","Canela al gusto opcional"],pasos:["Haz un corte a lo largo de cada banano sin partirlo completamente.","Coloca los cuadritos de chocolate dentro del corte.","Pon los bananos en la Air Fryer sobre papel para hornear.","Cocina a 160°C por 5-7 minutos, hasta que el chocolate se derrita.","Sirve con frutos secos picados o canela si deseas."],tip:"Usa bananos maduros pero firmes para que no se deshagan durante la cocción.",consejo:""},
{id:28,num:10,titulo:"Filete de Pescado Crocante",tipo:"Plato principal",tiempo:"25 min",prep:"10 min",airfryer:"10-12 min",temp:"180°C",cal:"330 kcal",prot:"31g",carb:"24g",gras:"12g",servings:2,ings:["2 filetes de pescado blanco de 120 a 150 g cada uno","1 huevo batido","1/2 taza de miga de pan o panko","2 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","Aceite en spray","Limón para servir opcional"],pasos:["Seca bien los filetes de pescado con papel de cocina.","Sazona con sal, pimienta, ajo en polvo y paprika.","Pasa cada filete por harina, luego por huevo batido y finalmente por panko.","Coloca los filetes en la Air Fryer sin encimarlos y rocía un poco de aceite.","Cocina a 180°C por 10-12 minutos, hasta que estén dorados y bien cocidos."],tip:"Usa panko si quieres una textura más crocante y evita mover mucho el pescado para que no se rompa.",consejo:"Sirve con unas gotas de limón al final para resaltar el sabor del pescado."},
{id:29,num:10,titulo:"Chips de Zucchini",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 zucchini o calabacín mediano","1 cdta de aceite de oliva","2 cdas de queso parmesano rallado opcional","2 cdas de miga de pan o panko opcional","1/2 cdta de ajo en polvo","Sal y pimienta al gusto"],pasos:["Lava el zucchini y córtalo en rodajas delgadas.","Sécalo bien con papel de cocina para retirar exceso de humedad.","Mezcla con aceite, ajo, sal, pimienta y queso si deseas.","Cocina en Air Fryer a 180°C por 8-10 minutos, revisando para que no se quemen."],tip:"El zucchini tiene mucha agua, por eso es importante secarlo bien antes de cocinarlo.",consejo:""},
{id:30,num:10,titulo:"Mini Torta de Vainilla",tipo:"Postre",tiempo:"25 min",prep:"10 min",airfryer:"12-15 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1/2 taza de harina de trigo","3 cdas de azúcar","1 huevo pequeño","3 cdas de leche","2 cdas de mantequilla derretida o aceite","1/2 cdta de polvo de hornear","1/2 cdta de esencia de vainilla","1 pizca de sal"],pasos:["Mezcla el huevo, azúcar, leche, mantequilla y vainilla.","Agrega harina, polvo de hornear y una pizca de sal.","Vierte la mezcla en un molde pequeño apto para Air Fryer.","Cocina a 160°C por 12-15 minutos.","Deja enfriar antes de desmoldar y servir."],tip:"No llenes el molde hasta el borde; deja espacio para que el pastel crezca durante la cocción.",consejo:""},
{id:31,num:11,titulo:"Pinchos de Pollo Teriyaki",tipo:"Plato principal",tiempo:"30 min",prep:"15 min",airfryer:"12-15 min",temp:"180°C",cal:"320 kcal",prot:"32g",carb:"10g",gras:"14g",servings:2,ings:["1 pechuga de pollo en cubos medianos","1 pimentón rojo pequeño en cuadros","1/2 cebolla cabezona en cuadros","4 palitos para pincho","3 cdas de salsa teriyaki","1 cdta de aceite","1/2 cdta de ajo en polvo","Pimienta al gusto","Ajonjolí opcional para decorar"],pasos:["Corta el pollo en cubos medianos y mézclalo con salsa teriyaki, aceite, ajo en polvo y pimienta.","Arma los pinchos alternando pollo, pimentón y cebolla.","Colócalos en la Air Fryer sin amontonarlos.","Cocina a 180°C por 10 minutos.","Barniza con un poco más de salsa teriyaki y cocina 2 a 5 minutos más."],tip:"Si usas palitos de madera, remójalos en agua 15 minutos antes para evitar que se quemen.",consejo:"No cortes el pollo demasiado pequeño para que no se seque durante la cocción."},
{id:32,num:11,titulo:"Arroz Crocante en Bolitas",tipo:"Acompañamiento",tiempo:"22 min",prep:"10 min",airfryer:"10-12 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 taza de arroz blanco cocido y frío","2 cdas de queso rallado","1 huevo pequeño","2 cdas de miga de pan","1 cda de cebolla larga finamente picada opcional","Sal y pimienta al gusto","1 cdta de aceite para pincelar"],pasos:["Mezcla el arroz cocido con queso, huevo, miga de pan, cebolla larga, sal y pimienta.","Forma bolitas medianas y compactas con las manos.","Pincela ligeramente con aceite.","Cocina en Air Fryer a 180°C por 10-12 minutos, volteándolas con cuidado a mitad de cocción."],tip:"El arroz debe estar frío para que la mezcla se compacte mejor y no se desarmen las bolitas.",consejo:""},
{id:33,num:11,titulo:"Piña Asada con Miel",tipo:"Postre",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["4 rodajas de piña fresca","1 cda de miel","1/2 cdta de canela en polvo","1 cdta de mantequilla derretida opcional","Coco rallado o nueces picadas opcional para servir"],pasos:["Mezcla la miel con la canela y la mantequilla si deseas.","Unta las rodajas de piña con esta mezcla por ambos lados.","Colócalas en la Air Fryer sin encimarlas.","Cocina a 180°C por 8-10 minutos, hasta que estén doradas y jugosas.","Sirve tibias con coco rallado o nueces si deseas."],tip:"No uses rodajas demasiado delgadas para que la piña no se seque.",consejo:""},
{id:34,num:12,titulo:"Lomo de Cerdo con Costra de Hierbas",tipo:"Plato principal",tiempo:"35 min",prep:"10 min",airfryer:"20-25 min",temp:"180°C",cal:"390 kcal",prot:"36g",carb:"14g",gras:"21g",servings:2,ings:["400 g de lomo de cerdo en una pieza o en 2 medallones gruesos","1 cda de aceite de oliva","1 cdta de mostaza","1/2 taza de miga de pan o panko","1/2 cdta de ajo en polvo","1/2 cdta de orégano seco","1/2 cdta de romero seco o fresco picado","Sal y pimienta al gusto"],pasos:["Seca el lomo de cerdo con papel de cocina y sazona con sal, pimienta y ajo en polvo.","Unta la superficie con aceite de oliva y mostaza.","Mezcla la miga de pan con orégano, romero y una pizca de sal.","Cubre el lomo con la mezcla de hierbas, presionando suavemente para que se adhiera.","Cocina en Air Fryer a 180°C por 20-25 minutos, hasta que esté dorado y bien cocido."],tip:"Deja reposar el lomo 5 minutos antes de cortarlo para que conserve mejor sus jugos.",consejo:"Si usas medallones, revisa desde el minuto 18 porque se cocinan más rápido."},
{id:35,num:12,titulo:"Zanahorias Glaseadas",tipo:"Acompañamiento",tiempo:"22 min",prep:"5 min",airfryer:"12-15 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["3 zanahorias medianas peladas","1 cda de miel o panela derretida","1 cdta de aceite de oliva","1/2 cdta de mantequilla derretida opcional","1 pizca de sal","Pimienta al gusto","Perejil fresco opcional para servir"],pasos:["Corta las zanahorias en bastones medianos o rodajas gruesas.","Mezcla miel, aceite, mantequilla, sal y pimienta.","Unta las zanahorias con la mezcla.","Cocina en Air Fryer a 180°C por 12-15 minutos, moviendo a mitad de cocción."],tip:"No cortes las zanahorias demasiado delgadas para que no se sequen ni se quemen.",consejo:""},
{id:36,num:12,titulo:"Brownie Blanco",tipo:"Postre",tiempo:"28 min",prep:"10 min",airfryer:"14-16 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:4,ings:["1/2 taza de harina de trigo","1/4 taza de azúcar","1 huevo pequeño","3 cdas de mantequilla derretida","1/4 taza de chocolate blanco picado o en chips","1/4 cdta de esencia de vainilla","1 pizca de sal","Nueces picadas opcional"],pasos:["Mezcla la mantequilla derretida con azúcar, huevo y vainilla.","Agrega harina, sal y mezcla hasta integrar.","Incorpora el chocolate blanco y las nueces si deseas.","Vierte la mezcla en un molde pequeño apto para Air Fryer.","Cocina a 160°C por 14-16 minutos y deja enfriar antes de cortar."],tip:"No lo cocines demasiado; el brownie blanco debe quedar suave en el centro y firme al enfriar.",consejo:""},
{id:37,num:13,titulo:"Tenders de Pollo Estilo Restaurante",tipo:"Plato principal",tiempo:"30 min",prep:"15 min",airfryer:"12-15 min",temp:"190°C",cal:"370 kcal",prot:"36g",carb:"25g",gras:"14g",servings:2,ings:["1 pechuga de pollo en tiras gruesas","1 huevo batido","1/2 taza de miga de pan o panko","3 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","1/2 cdta de sal","Pimienta al gusto","Aceite en spray"],pasos:["Corta la pechuga en tiras gruesas y sazona con sal, pimienta, ajo en polvo y paprika.","Pasa cada tira por harina, luego por huevo batido y finalmente por miga de pan o panko.","Presiona suavemente el apanado para que se adhiera bien.","Coloca los tenders en la Air Fryer sin encimarlos y rocía un poco de aceite.","Cocina a 190°C por 12-15 minutos, volteando a mitad de cocción."],tip:"Para un acabado más crocante estilo restaurante, usa panko y rocía una capa ligera de aceite antes de cocinar.",consejo:"No cortes las tiras demasiado delgadas para que queden jugosas por dentro."},
{id:38,num:13,titulo:"Aros de Cebolla Crujientes",tipo:"Acompañamiento",tiempo:"20 min",prep:"10 min",airfryer:"8-10 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 cebolla cabezona grande","1 huevo batido","1/2 taza de miga de pan o panko","3 cdas de harina de trigo","1/2 cdta de paprika","1/2 cdta de ajo en polvo","Sal y pimienta al gusto","Aceite en spray"],pasos:["Pela la cebolla y córtala en aros medianos.","Pasa cada aro por harina, luego por huevo batido y finalmente por panko.","Coloca los aros en la Air Fryer sin encimarlos.","Rocía un poco de aceite y cocina a 190°C por 8-10 minutos, volteando con cuidado a mitad de cocción."],tip:"Usa aros medianos, no muy delgados, para que no se rompan al apanarlos.",consejo:""},
{id:39,num:13,titulo:"Rollitos de Canela",tipo:"Postre",tiempo:"18 min",prep:"8 min",airfryer:"8-10 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:6,ings:["1 lámina de masa de hojaldre o masa lista para panadería","2 cdas de azúcar","1 cdta de canela en polvo","1 cda de mantequilla derretida","2 cdas de queso crema opcional para decorar","1 cda de azúcar pulverizada opcional"],pasos:["Extiende la masa y úntala con mantequilla derretida.","Mezcla azúcar con canela y espárcela sobre la masa.","Enrolla la masa y corta rollitos pequeños.","Cocina en Air Fryer a 160°C por 8-10 minutos.","Decora con queso crema o azúcar pulverizada si deseas."],tip:"Haz los rollitos pequeños para que se cocinen bien por dentro y no se doren demasiado por fuera.",consejo:""},
{id:40,num:14,titulo:"Albóndigas Jugosas en Salsa BBQ",tipo:"Plato principal",tiempo:"30 min",prep:"12 min",airfryer:"15-18 min",temp:"180°C",cal:"430 kcal",prot:"30g",carb:"18g",gras:"27g",servings:2,ings:["350 g de carne molida de res","1 huevo pequeño","3 cdas de miga de pan","1 cda de cebolla cabezona finamente picada","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","4 cdas de salsa BBQ","1 cdta de aceite para pincelar"],pasos:["Mezcla la carne molida con huevo, miga de pan, cebolla, ajo, paprika, sal y pimienta.","Forma albóndigas medianas del mismo tamaño para que se cocinen parejo.","Colócalas en la Air Fryer sin encimarlas y pincela con un poco de aceite.","Cocina a 180°C por 12 minutos, moviéndolas con cuidado a mitad de cocción.","Barniza con salsa BBQ y cocina 3-6 minutos más hasta que estén doradas y jugosas."],tip:"No aprietes demasiado la mezcla al formar las albóndigas; así quedarán más suaves y jugosas.",consejo:"Si quieres una salsa más brillante, mezcla la BBQ con 1 cucharadita de miel antes de barnizar."},
{id:41,num:14,titulo:"Pan de Ajo Crujiente",tipo:"Acompañamiento",tiempo:"15 min",prep:"5 min",airfryer:"5-7 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 pan francés pequeño o 4 tajadas de pan tipo baguette","2 cdas de mantequilla derretida","1 diente de ajo finamente picado","1 cda de perejil o cilantro picado","2 cdas de queso rallado opcional","1 pizca de sal"],pasos:["Mezcla la mantequilla derretida con ajo, perejil, queso y sal.","Unta el pan con la mezcla por la parte superior.","Coloca las tajadas en la Air Fryer sin encimarlas.","Cocina a 180°C por 5-7 minutos, hasta que estén doradas y crujientes."],tip:"El pan se dora rápido, así que revísalo antes de terminar para evitar que se queme.",consejo:""},
{id:42,num:14,titulo:"Galletas con Chips de Chocolate",tipo:"Postre",tiempo:"20 min",prep:"10 min",airfryer:"8-10 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:8,ings:["1/2 taza de harina de trigo","3 cdas de mantequilla a temperatura ambiente","3 cdas de azúcar morena o blanca","1 huevo pequeño","1/4 cdta de esencia de vainilla","1/4 cdta de polvo de hornear","1 pizca de sal","3 cdas de chips de chocolate"],pasos:["Mezcla la mantequilla con el azúcar hasta integrar bien.","Agrega el huevo, la vainilla y mezcla nuevamente.","Incorpora harina, polvo de hornear, sal y chips de chocolate.","Forma bolitas pequeñas y aplánalas suavemente.","Cocina en Air Fryer a 160°C por 8-10 minutos y deja enfriar antes de servir."],tip:"Al salir pueden sentirse blandas, pero se afirman al enfriar. No las cocines de más.",consejo:""},
{id:43,num:15,titulo:"Wrap Crispy de Pollo",tipo:"Plato principal",tiempo:"30 min",prep:"15 min",airfryer:"12-15 min",temp:"190°C",cal:"460 kcal",prot:"36g",carb:"42g",gras:"18g",servings:2,ings:["1 pechuga de pollo en tiras gruesas","2 tortillas grandes de trigo","1 huevo batido","1/2 taza de miga de pan o panko","2 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","2 hojas de lechuga picada","2 cdas de salsa ranch miel mostaza o mayonesa suave","Aceite en spray"],pasos:["Sazona las tiras de pollo con sal, pimienta, ajo en polvo y paprika.","Pasa cada tira por harina, luego por huevo batido y finalmente por panko.","Cocina en Air Fryer a 190°C por 12-15 minutos, volteando a mitad de cocción.","Calienta las tortillas 1 minuto en la Air Fryer o en sartén para que sean más flexibles.","Arma los wraps con lechuga, pollo crispy y salsa al gusto."],tip:"Usa panko para lograr una textura más crujiente y no rellenes demasiado el wrap.",consejo:"Para que el wrap quede más firme, dóblalo bien y llévalo 2 minutos a la Air Fryer después de armarlo."},
{id:44,num:15,titulo:"Chips de Papa Caseros",tipo:"Acompañamiento",tiempo:"25 min",prep:"5 min",airfryer:"12-15 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 papas medianas","1 cda de aceite","1/2 cdta de paprika","1/2 cdta de ajo en polvo","Sal al gusto","Pimienta al gusto","Perejil o cilantro picado opcional"],pasos:["Lava las papas y córtalas en rodajas delgadas.","Seca muy bien las rodajas con papel de cocina.","Mezcla con aceite, paprika, ajo en polvo, sal y pimienta.","Cocina en Air Fryer a 180°C por 12-15 minutos, moviendo a mitad de cocción."],tip:"Mientras más secas estén las papas antes de cocinarlas, más doradas y crocantes quedarán.",consejo:""},
{id:45,num:15,titulo:"Mini Pastel de Manzana",tipo:"Postre",tiempo:"28 min",prep:"8 min",airfryer:"14-16 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 manzana roja mediana pelada y picada en cubitos","1/2 taza de harina de trigo","1 huevo pequeño","3 cdas de leche","2 cdas de azúcar o panela pulverizada","2 cdas de mantequilla derretida","1/2 cdta de polvo de hornear","1/2 cdta de canela en polvo","1/4 cdta de esencia de vainilla"],pasos:["Mezcla huevo, leche, azúcar, mantequilla y vainilla.","Agrega harina, polvo de hornear y canela hasta integrar.","Incorpora la manzana picada suavemente.","Vierte la mezcla en un molde pequeño apto para Air Fryer.","Cocina a 160°C por 14-16 minutos y deja enfriar antes de servir."],tip:"No llenes el molde hasta el borde; deja espacio para que el pastel crezca durante la cocción.",consejo:""},
{id:46,num:16,titulo:"Milanesa de Res Crocante",tipo:"Plato principal",tiempo:"30 min",prep:"15 min",airfryer:"10-12 min",temp:"190°C",cal:"420 kcal",prot:"34g",carb:"28g",gras:"20g",servings:2,ings:["2 filetes de carne de res delgados de 120 a 150 g cada uno","1 huevo batido","1/2 taza de miga de pan o panko","3 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","Aceite en spray","Limón para servir opcional"],pasos:["Sazona los filetes con sal, pimienta, ajo en polvo y paprika.","Pasa cada filete por harina, luego por huevo batido y finalmente por panko.","Presiona suavemente el apanado para que se adhiera bien.","Coloca los filetes en la Air Fryer sin encimarlos y rocía un poco de aceite.","Cocina a 190°C por 10-12 minutos, volteando a mitad de cocción."],tip:"Usa filetes delgados para que la milanesa quede dorada por fuera y bien cocida por dentro.",consejo:"No uses filetes muy gruesos porque pueden dorarse por fuera antes de cocinarse bien por dentro."},
{id:47,num:16,titulo:"Ensalada Tibia de Vegetales",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"10-12 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1/2 zucchini mediano en medias lunas","1/2 pimentón rojo en tiras","1/2 cebolla cabezona en plumas","1 zanahoria pequeña en bastones delgados","1 cda de aceite de oliva","1/2 cdta de ajo en polvo","Sal y pimienta al gusto","Gotas de limón opcional"],pasos:["Corta los vegetales en tamaños similares para que se cocinen parejo.","Mézclalos con aceite, ajo en polvo, sal y pimienta.","Cocina en Air Fryer a 180°C por 10-12 minutos, moviendo a mitad de cocción.","Sirve tibios con unas gotas de limón si deseas."],tip:"No cortes los vegetales demasiado pequeños para evitar que se sequen o se quemen.",consejo:""},
{id:48,num:16,titulo:"Arepitas Dulces con Queso",tipo:"Postre",tiempo:"22 min",prep:"10 min",airfryer:"10-12 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:4,ings:["1/2 taza de harina de maíz precocida","1/4 taza de queso costeño campesino o mozzarella rallado","2 cdas de panela pulverizada o azúcar","1/2 taza de agua tibia aproximada","1 cdta de mantequilla derretida","1 pizca de sal","Queso extra para servir opcional"],pasos:["Mezcla la harina de maíz con panela, sal y queso rallado.","Agrega agua tibia poco a poco hasta formar una masa suave.","Forma arepitas pequeñas y pincélalas con mantequilla derretida.","Cocina en Air Fryer a 180°C por 10-12 minutos, volteando a mitad de cocción.","Sirve tibias con un poco más de queso si deseas."],tip:"La masa debe quedar suave pero manejable; si se agrieta, agrega un poquito más de agua tibia.",consejo:""},
{id:49,num:17,titulo:"Muslos de Pollo Dorados con Paprika",tipo:"Plato principal",tiempo:"40 min",prep:"10 min",airfryer:"25-30 min",temp:"190°C",cal:"390 kcal",prot:"32g",carb:"2g",gras:"28g",servings:2,ings:["4 muslos de pollo pequeños o medianos","1 cda de aceite","1 cdta de paprika","1/2 cdta de ajo en polvo","1/2 cdta de cebolla en polvo opcional","1/2 cdta de sal","Pimienta al gusto","Gotas de limón opcional"],pasos:["Seca bien los muslos de pollo con papel de cocina.","Mezcla aceite, paprika, ajo en polvo, cebolla en polvo, sal, pimienta y gotas de limón.","Unta los muslos con la mezcla por todos los lados.","Colócalos en la Air Fryer sin amontonarlos.","Cocina a 190°C por 25-30 minutos, volteando a mitad de cocción."],tip:"Secar bien el pollo antes de sazonarlo ayuda a que quede más dorado durante la cocción.",consejo:"Si los muslos son grandes, aumenta 5 minutos la cocción y verifica que estén bien cocidos."},
{id:50,num:17,titulo:"Mazorca Dorada con Queso",tipo:"Acompañamiento",tiempo:"22 min",prep:"5 min",airfryer:"12-15 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 mazorcas tiernas partidas en mitades","1 cda de mantequilla derretida","1 cdta de aceite","1/4 taza de queso rallado","Sal al gusto","Perejil o cilantro picado opcional","Paprika opcional para decorar"],pasos:["Mezcla la mantequilla derretida con aceite y sal.","Unta las mazorcas con la mezcla por todos los lados.","Cocina en Air Fryer a 190°C por 12-15 minutos.","Sirve con queso rallado, perejil o cilantro y una pizca de paprika si deseas."],tip:"Si las mazorcas están muy grandes, pártelas en trozos pequeños para que se cocinen mejor.",consejo:""},
{id:51,num:17,titulo:"Muffins de Chocolate",tipo:"Postre",tiempo:"27 min",prep:"10 min",airfryer:"12-15 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:4,ings:["1/2 taza de harina de trigo","2 cdas de cocoa en polvo","3 cdas de azúcar","1 huevo pequeño","3 cdas de leche","2 cdas de mantequilla derretida o aceite","1/2 cdta de polvo de hornear","1/4 cdta de esencia de vainilla","2 cdas de chips de chocolate opcional"],pasos:["Mezcla huevo, leche, azúcar, mantequilla y vainilla.","Agrega harina, cocoa y polvo de hornear.","Incorpora los chips de chocolate si deseas.","Vierte la mezcla en moldes pequeños aptos para Air Fryer.","Cocina a 160°C por 12-15 minutos y deja enfriar antes de servir."],tip:"No llenes los moldes hasta el borde; deja espacio para que los muffins crezcan.",consejo:""},
{id:52,num:18,titulo:"Tacos Crispy de Carne",tipo:"Plato principal",tiempo:"30 min",prep:"15 min",airfryer:"10-12 min",temp:"190°C",cal:"460 kcal",prot:"30g",carb:"34g",gras:"24g",servings:2,ings:["300 g de carne molida de res","4 tortillas pequeñas de maíz o trigo","1/2 cebolla cabezona finamente picada","1/2 cdta de ajo en polvo","1/2 cdta de paprika","1/2 cdta de comino opcional","Sal y pimienta al gusto","1/2 taza de queso mozzarella o queso rallado","1 cda de aceite","Lechuga picada opcional para servir"],pasos:["Cocina la carne molida con cebolla, ajo, paprika, comino, sal y pimienta hasta que esté bien cocida.","Rellena cada tortilla con carne y un poco de queso.","Dobla las tortillas formando tacos y pincélalas ligeramente con aceite.","Coloca los tacos en la Air Fryer sin encimarlos.","Cocina a 190°C por 10-12 minutos, volteando a mitad de cocción."],tip:"No rellenes demasiado los tacos para que cierren bien y queden dorados de forma pareja.",consejo:"Si las tortillas están muy rígidas, caliéntalas unos segundos antes de rellenarlas."},
{id:53,num:18,titulo:"Nachos de Plátano Verde",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"10-12 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 plátano verde grande","1 cda de aceite","1/2 cdta de sal","1/2 cdta de paprika opcional","1/2 cdta de ajo en polvo opcional","Limón opcional para servir"],pasos:["Pela el plátano verde y córtalo en rodajas muy delgadas.","Mezcla las rodajas con aceite, sal, paprika y ajo en polvo si deseas.","Colócalas en la Air Fryer sin encimarlas.","Cocina a 180°C por 10-12 minutos, moviendo a mitad de cocción, hasta que estén doradas."],tip:"Corta el plátano en rodajas delgadas y parejas para que los nachos queden más crocantes.",consejo:""},
{id:54,num:18,titulo:"Duraznos Asados con Crema",tipo:"Postre",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"170°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 duraznos medianos firmes o 4 mitades de durazno en almíbar bien escurridas","1 cda de miel o panela derretida","1/2 cdta de canela en polvo","1 cdta de mantequilla derretida opcional","3 cdas de crema de leche o yogur griego para servir","Nueces picadas opcional"],pasos:["Parte los duraznos por la mitad y retira la pepa si usas duraznos frescos.","Mezcla miel, canela y mantequilla derretida.","Unta los duraznos con la mezcla por la parte superior.","Cocina en Air Fryer a 170°C por 8-10 minutos.","Sirve tibios con crema de leche, yogur griego o nueces picadas."],tip:"Si usas duraznos en almíbar, escúrrelos muy bien antes de llevarlos a la Air Fryer.",consejo:""},
{id:55,num:19,titulo:"Pechuga Parmesana",tipo:"Plato principal",tiempo:"35 min",prep:"15 min",airfryer:"15-18 min",temp:"190°C",cal:"470 kcal",prot:"44g",carb:"28g",gras:"21g",servings:2,ings:["1 pechuga de pollo en 2 filetes medianos","1 huevo batido","1/2 taza de miga de pan o panko","3 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","4 cdas de salsa napolitana o salsa de tomate","1/4 taza de queso mozzarella rallado","2 cdas de queso parmesano rallado","Aceite en spray"],pasos:["Sazona los filetes de pollo con sal, pimienta, ajo en polvo y paprika.","Pasa cada filete por harina, luego por huevo batido y finalmente por panko.","Coloca los filetes en la Air Fryer sin encimarlos y rocía un poco de aceite.","Cocina a 190°C por 12 minutos, volteando a mitad de cocción.","Agrega salsa napolitana, mozzarella y parmesano encima; cocina 3-6 minutos más hasta que el queso se derrita."],tip:"No agregues la salsa desde el inicio para que el apanado no se humedezca demasiado.",consejo:"Usa filetes de grosor parecido para que ambos se cocinen de manera uniforme."},
{id:56,num:19,titulo:"Brócoli Gratinado",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 tazas de brócoli en arbolitos pequeños","2 cdas de crema de leche o yogur natural sin dulce","1/4 taza de queso mozzarella rallado","1 cda de queso parmesano rallado opcional","1/2 cdta de ajo en polvo","Sal y pimienta al gusto","1 cdta de aceite o mantequilla derretida opcional"],pasos:["Mezcla el brócoli con crema de leche, ajo en polvo, sal y pimienta.","Colócalo en un molde pequeño apto para Air Fryer.","Agrega mozzarella y parmesano por encima.","Cocina a 180°C por 8-10 minutos, hasta que el queso se derrita y dore ligeramente."],tip:"Corta el brócoli en arbolitos pequeños para que se cocine rápido y quede suave sin quemarse.",consejo:""},
{id:57,num:19,titulo:"Mini Volcán de Chocolate",tipo:"Postre",tiempo:"17 min",prep:"8 min",airfryer:"7-9 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1/4 taza de chocolate semiamargo o de leche picado","2 cdas de mantequilla","1 huevo pequeño","2 cdas de azúcar","2 cdas de harina de trigo","1/4 cdta de esencia de vainilla","1 pizca de sal","Cocoa o azúcar pulverizada opcional para decorar"],pasos:["Derrite el chocolate con la mantequilla y deja enfriar un poco.","Mezcla con huevo, azúcar, vainilla y una pizca de sal.","Agrega la harina y mezcla hasta integrar.","Vierte en un molde pequeño apto para Air Fryer, sin llenarlo hasta el borde.","Cocina a 160°C por 7-9 minutos, hasta que esté firme por fuera y suave en el centro."],tip:"No lo cocines demasiado; el centro debe quedar suave para lograr el efecto de volcán.",consejo:""},
{id:58,num:20,titulo:"Chorizo Artesanal Dorado",tipo:"Plato principal",tiempo:"22 min",prep:"5 min",airfryer:"15-17 min",temp:"180°C",cal:"430 kcal",prot:"22g",carb:"5g",gras:"36g",servings:2,ings:["4 chorizos artesanales medianos","1 cdta de aceite opcional","1/2 cebolla cabezona en julianas opcional","1/2 pimentón rojo en tiras opcional","Gotas de limón opcional","Arepitas pequeñas o pan para servir opcional"],pasos:["Pincha ligeramente los chorizos con un tenedor para evitar que revienten.","Coloca los chorizos en la Air Fryer sin amontonarlos.","Cocina a 180°C por 10 minutos.","Voltea los chorizos y agrega cebolla o pimentón si deseas.","Cocina 5-7 minutos más, hasta que estén dorados y bien cocidos."],tip:"No cocines los chorizos a temperatura demasiado alta desde el inicio.",consejo:"Si los chorizos son muy gruesos, aumenta 3 a 5 minutos la cocción."},
{id:59,num:20,titulo:"Papas en Casco con Salsa",tipo:"Acompañamiento",tiempo:"30 min",prep:"5 min",airfryer:"20-25 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 papas medianas","1 cda de aceite","1/2 cdta de paprika","1/2 cdta de ajo en polvo","Sal y pimienta al gusto","Perejil o cilantro picado opcional","3 cdas de mayonesa","1 cda de salsa de tomate","Gotas de limón","1 pizca de ajo en polvo opcional"],pasos:["Lava las papas y córtalas en cascos medianos.","Sécalas bien y mézclalas con aceite, paprika, ajo en polvo, sal y pimienta.","Cocina en Air Fryer a 190°C por 20-25 minutos, moviendo a mitad de cocción.","Mezcla los ingredientes de la salsa y sirve junto a las papas."],tip:"Seca muy bien las papas antes de cocinarlas para que queden más doradas y no blandas por fuera.",consejo:""},
{id:60,num:20,titulo:"Bocaditos de Hojaldre Dulce",tipo:"Postre",tiempo:"18 min",prep:"8 min",airfryer:"8-10 min",temp:"170°C",cal:"",prot:"",carb:"",gras:"",servings:8,ings:["1 lámina pequeña de masa de hojaldre","2 cdas de azúcar","1/2 cdta de canela en polvo","1 cda de mantequilla derretida","2 cdas de bocadillo arequipe o mermelada espesa","Azúcar pulverizada opcional para decorar"],pasos:["Corta la masa de hojaldre en cuadritos pequeños.","Coloca un poquito de bocadillo arequipe o mermelada en el centro.","Cierra cada cuadrito formando un paquetito y presiona los bordes.","Pincela con mantequilla y espolvorea azúcar con canela.","Cocina en Air Fryer a 170°C por 8-10 minutos, hasta que estén dorados."],tip:"No pongas demasiado relleno para evitar que se salga durante la cocción.",consejo:""},
{id:61,num:21,titulo:"Pescado Blanco con Costra de Limón",tipo:"Plato principal",tiempo:"25 min",prep:"10 min",airfryer:"10-12 min",temp:"180°C",cal:"310 kcal",prot:"30g",carb:"22g",gras:"11g",servings:2,ings:["2 filetes de pescado blanco de 120 a 150 g cada uno","1 huevo batido","1/2 taza de miga de pan o panko","1 cdta de ralladura de limón","1 cda de jugo de limón","1/2 cdta de ajo en polvo","Sal y pimienta al gusto","Aceite en spray","Rodajas de limón para servir opcional"],pasos:["Seca bien los filetes de pescado con papel de cocina.","Sazona con sal, pimienta, ajo en polvo y jugo de limón.","Mezcla la miga de pan o panko con la ralladura de limón.","Pasa cada filete por huevo batido y luego por la mezcla de miga de pan con limón.","Cocina en Air Fryer a 180°C por 10-12 minutos, hasta que esté dorado y bien cocido."],tip:"No muevas demasiado el pescado durante la cocción para evitar que se rompa.",consejo:"Agrega unas gotas de limón al servir para resaltar el sabor fresco del pescado."},
{id:62,num:21,titulo:"Yuca Dorada con Ajo",tipo:"Acompañamiento",tiempo:"25 min",prep:"5 min",airfryer:"15-18 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["300 g de yuca pelada y cocida","1 cda de aceite","1 diente de ajo finamente picado","1/2 cdta de paprika opcional","Sal y pimienta al gusto","Perejil o cilantro picado opcional"],pasos:["Cocina la yuca previamente hasta que esté suave pero firme.","Corta la yuca en bastones medianos.","Mezcla con aceite, ajo, paprika, sal y pimienta.","Cocina en Air Fryer a 190°C por 15-18 minutos, moviendo a mitad de cocción."],tip:"La yuca debe estar cocida pero firme para que no se deshaga al cortarla ni al moverla.",consejo:""},
{id:63,num:21,titulo:"Galletas de Coco",tipo:"Postre",tiempo:"20 min",prep:"10 min",airfryer:"8-10 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:8,ings:["1/2 taza de coco rallado","1/4 taza de harina de trigo","3 cdas de azúcar","1 huevo pequeño","2 cdas de mantequilla derretida","1/4 cdta de esencia de vainilla","1 pizca de sal"],pasos:["Mezcla el huevo con azúcar, mantequilla y vainilla.","Agrega coco rallado, harina y una pizca de sal.","Forma bolitas pequeñas y aplánalas suavemente.","Cocina en Air Fryer a 160°C por 8-10 minutos.","Deja enfriar antes de servir para que tomen mejor textura."],tip:"Revisa las galletas desde el minuto 8, porque el coco se dora rápido y puede quemarse.",consejo:""},
{id:64,num:22,titulo:"Pollo Apanado con Corn Flakes",tipo:"Plato principal",tiempo:"30 min",prep:"15 min",airfryer:"12-15 min",temp:"190°C",cal:"390 kcal",prot:"39g",carb:"32g",gras:"12g",servings:2,ings:["1 pechuga de pollo en 2 filetes medianos","1 huevo batido","1 taza de corn flakes sin azúcar triturados","2 cdas de harina de trigo","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","Aceite en spray"],pasos:["Sazona los filetes de pollo con sal, pimienta, ajo en polvo y paprika.","Pasa cada filete por harina, luego por huevo batido y finalmente por corn flakes triturados.","Presiona suavemente el apanado para que se adhiera bien al pollo.","Coloca los filetes en la Air Fryer sin encimarlos y rocía un poco de aceite.","Cocina a 190°C por 12-15 minutos, volteando a mitad de cocción."],tip:"Tritura los corn flakes con las manos o dentro de una bolsa para que el apanado quede más crocante.",consejo:"Usa corn flakes sin azúcar para evitar que el apanado se dore demasiado rápido."},
{id:65,num:22,titulo:"Bastones de Zanahoria Crujiente",tipo:"Acompañamiento",tiempo:"20 min",prep:"5 min",airfryer:"12-15 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["3 zanahorias medianas","1 cda de aceite de oliva o aceite común","1/2 cdta de ajo en polvo","1/2 cdta de paprika","2 cdas de queso parmesano o queso rallado opcional","Sal y pimienta al gusto","Perejil o cilantro picado opcional"],pasos:["Pela las zanahorias y córtalas en bastones medianos.","Mézclalas con aceite, ajo en polvo, paprika, sal y pimienta.","Agrega queso rallado si deseas más sabor.","Cocina en Air Fryer a 180°C por 12-15 minutos, moviendo a mitad de cocción."],tip:"No cortes los bastones demasiado delgados para evitar que se sequen o se quemen.",consejo:""},
{id:66,num:22,titulo:"Tortica de Zanahoria",tipo:"Postre",tiempo:"28 min",prep:"10 min",airfryer:"14-16 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1/2 taza de harina de trigo","1/4 taza de zanahoria rallada fina","1 huevo pequeño","3 cdas de leche","2 cdas de azúcar o panela pulverizada","2 cdas de aceite o mantequilla derretida","1/2 cdta de polvo de hornear","1/2 cdta de canela en polvo","1/4 cdta de esencia de vainilla","Nueces picadas opcional"],pasos:["Mezcla el huevo, leche, azúcar, aceite y vainilla.","Agrega harina, polvo de hornear y canela hasta integrar.","Incorpora la zanahoria rallada y las nueces si deseas.","Vierte la mezcla en un molde pequeño apto para Air Fryer.","Cocina a 160°C por 14-16 minutos y deja enfriar antes de servir."],tip:"Ralla la zanahoria fina para que la tortica quede más suave y se cocine de manera uniforme.",consejo:""},
{id:67,num:23,titulo:"Cerdo Agridulce Estilo Oriental",tipo:"Plato principal",tiempo:"35 min",prep:"15 min",airfryer:"15-18 min",temp:"180°C",cal:"420 kcal",prot:"34g",carb:"20g",gras:"23g",servings:2,ings:["400 g de lomo de cerdo en cubos medianos","1 cda de aceite","2 cdas de salsa de soya","2 cdas de salsa de tomate","1 cda de miel o panela derretida","1 cda de vinagre blanco o jugo de limón","1/2 cdta de ajo en polvo","1/2 cdta de paprika opcional","Sal y pimienta al gusto","1 cdta de maicena disuelta en 2 cdas de agua"],pasos:["Sazona los cubos de cerdo con aceite, ajo en polvo, paprika, sal y pimienta.","Coloca el cerdo en la Air Fryer sin amontonarlo.","Cocina a 180°C por 12 minutos, moviendo a mitad de cocción.","Mezcla salsa de soya, salsa de tomate, miel, vinagre y maicena disuelta.","Barniza el cerdo con la salsa y cocina 3-6 minutos más hasta que quede brillante y bien cocido."],tip:"No cortes el cerdo demasiado pequeño para que no se seque durante la cocción.",consejo:"Barniza con la salsa solo al final para evitar que el dulce se queme antes de que el cerdo esté listo."},
{id:68,num:23,titulo:"Vegetales Salteados Crujientes",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1/2 zucchini mediano en medias lunas","1/2 pimentón rojo en tiras","1/2 pimentón amarillo en tiras opcional","1/2 cebolla cabezona en plumas","1 zanahoria pequeña en bastones delgados","1 cda de aceite","1 cda de salsa de soya","1/2 cdta de ajo en polvo","Pimienta al gusto","Ajonjolí opcional para servir"],pasos:["Corta los vegetales en tamaños similares para que se cocinen parejo.","Mezcla con aceite, salsa de soya, ajo en polvo y pimienta.","Coloca los vegetales en la Air Fryer sin amontonarlos demasiado.","Cocina a 180°C por 8-10 minutos, moviendo a mitad de cocción."],tip:"No cocines demasiado los vegetales para que conserven buen color y textura.",consejo:""},
{id:69,num:23,titulo:"Banano Caramelizado",tipo:"Postre",tiempo:"12 min",prep:"5 min",airfryer:"5-7 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 bananos maduros firmes","1 cda de panela pulverizada o azúcar morena","1/2 cdta de canela en polvo","1 cdta de mantequilla derretida","1 cda de nueces maní o coco rallado opcional"],pasos:["Pela los bananos y pártelos a lo largo o en rodajas gruesas.","Mezcla la mantequilla derretida con panela y canela.","Unta los bananos con la mezcla por encima.","Cocina en Air Fryer a 160°C por 5-7 minutos.","Sirve tibio con nueces, maní o coco rallado si deseas."],tip:"Usa bananos maduros pero firmes para que no se deshagan durante la cocción.",consejo:""},
{id:70,num:24,titulo:"Mini Pizzas de Pollo y Queso",tipo:"Plato principal",tiempo:"25 min",prep:"10 min",airfryer:"8-10 min",temp:"180°C",cal:"420 kcal",prot:"30g",carb:"38g",gras:"17g",servings:2,ings:["4 tortillas pequeñas de trigo pan árabe o bases de pizza pequeñas","1 taza de pollo cocido y desmechado","4 cdas de salsa napolitana o salsa de tomate para pasta","1/2 taza de queso mozzarella rallado","2 cdas de maíz tierno opcional","1/4 pimentón rojo en cubitos opcional","1/2 cdta de orégano seco","1 cda de aceite opcional para pincelar los bordes"],pasos:["Coloca las tortillas o bases pequeñas sobre una superficie limpia.","Unta cada base con salsa napolitana.","Agrega pollo desmechado, queso mozzarella, maíz y pimentón si deseas.","Espolvorea orégano y pincela los bordes con un poquito de aceite.","Cocina en Air Fryer a 180°C por 8-10 minutos, hasta que el queso se derrita y los bordes estén dorados."],tip:"No agregues demasiada salsa para evitar que la base quede húmeda o blanda.",consejo:"Si usas tortillas muy delgadas, coloca papel para hornear debajo para que sea más fácil retirarlas."},
{id:71,num:24,titulo:"Chips de Berenjena",tipo:"Acompañamiento",tiempo:"18 min",prep:"5 min",airfryer:"8-10 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 berenjena mediana","1 cda de aceite de oliva o aceite común","1/2 cdta de ajo en polvo","1/2 cdta de paprika opcional","2 cdas de queso parmesano o queso rallado opcional","Sal y pimienta al gusto","Perejil o cilantro picado opcional"],pasos:["Lava la berenjena y córtala en rodajas delgadas, pero no transparentes.","Seca las rodajas con papel de cocina para retirar humedad.","Mezcla con aceite, ajo en polvo, paprika, sal, pimienta y queso si deseas.","Cocina en Air Fryer a 180°C por 8-10 minutos, revisando para que no se quemen."],tip:"La berenjena se cocina rápido; no la cortes demasiado delgada para que no se queme ni quede seca.",consejo:""},
{id:72,num:24,titulo:"Palitos Dulces de Hojaldre",tipo:"Postre",tiempo:"17 min",prep:"8 min",airfryer:"7-9 min",temp:"170°C",cal:"",prot:"",carb:"",gras:"",servings:6,ings:["1 lámina pequeña de masa de hojaldre","1 cda de mantequilla derretida","2 cdas de azúcar","1/2 cdta de canela en polvo","1 cda de azúcar pulverizada opcional","Arequipe o mermelada opcional para servir"],pasos:["Corta la masa de hojaldre en tiras medianas.","Pincela cada tira con mantequilla derretida.","Mezcla azúcar con canela y espolvorea sobre las tiras.","Cocina en Air Fryer a 170°C por 7-9 minutos, hasta que estén doradas.","Sirve con azúcar pulverizada, arequipe o mermelada si deseas."],tip:"Deja espacio entre los palitos para que el hojaldre crezca y se dore de manera pareja.",consejo:""},
{id:73,num:25,titulo:"Brochetas de Res con Pimentón",tipo:"Plato principal",tiempo:"35 min",prep:"15 min",airfryer:"12-15 min",temp:"190°C",cal:"390 kcal",prot:"34g",carb:"7g",gras:"25g",servings:2,ings:["350 g de carne de res blanda en cubos medianos","1/2 pimentón rojo en cuadros","1/2 pimentón verde o amarillo en cuadros opcional","1/2 cebolla cabezona en cuadros","4 palitos para brocheta","1 cda de aceite","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","Gotas de limón opcional"],pasos:["Corta la carne en cubos medianos y sazónala con aceite, ajo en polvo, paprika, sal, pimienta y gotas de limón.","Arma las brochetas alternando carne, pimentón y cebolla.","Coloca las brochetas en la Air Fryer sin amontonarlas.","Cocina a 190°C por 12-15 minutos, volteando a mitad de cocción.","Sirve cuando la carne esté dorada por fuera y cocida al punto deseado."],tip:"Usa una carne blanda y corta los cubos de tamaño parecido para que se cocinen de manera uniforme.",consejo:"Si usas palitos de madera, remójalos en agua 15 minutos antes para evitar que se quemen demasiado."},
{id:74,num:25,titulo:"Papas Baby Doradas",tipo:"Acompañamiento",tiempo:"28 min",prep:"5 min",airfryer:"18-22 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["300 g de papas baby o papas pequeñas lavadas","1 cda de aceite","1/2 cdta de ajo en polvo","1/2 cdta de paprika","1/2 cdta de orégano seco opcional","Sal y pimienta al gusto","Perejil o cilantro picado opcional"],pasos:["Lava bien las papas baby y sécalas con papel de cocina.","Si están grandes, pártelas a la mitad.","Mézclalas con aceite, ajo en polvo, paprika, orégano, sal y pimienta.","Cocina en Air Fryer a 190°C por 18-22 minutos, moviendo a mitad de cocción."],tip:"Seca bien las papas antes de sazonarlas para que queden más doradas y no húmedas por fuera.",consejo:""},
{id:75,num:25,titulo:"Mini Brownies de Milo",tipo:"Postre",tiempo:"24 min",prep:"10 min",airfryer:"10-12 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:4,ings:["1/2 taza de harina de trigo","1/4 taza de Milo","2 cdas de cocoa en polvo opcional","3 cdas de azúcar","1 huevo pequeño","3 cdas de leche","2 cdas de mantequilla derretida","1/4 cdta de esencia de vainilla","1 pizca de sal","Chips de chocolate opcional"],pasos:["Mezcla el huevo, leche, azúcar, mantequilla y vainilla.","Agrega harina, Milo, cocoa y una pizca de sal.","Mezcla hasta integrar sin batir demasiado.","Vierte la mezcla en moldes pequeños aptos para Air Fryer.","Cocina a 160°C por 10-12 minutos y deja enfriar antes de servir."],tip:"No los cocines demasiado para que queden suaves por dentro y no secos.",consejo:""},
{id:76,num:26,titulo:"Empanaditas de Pollo en Air Fryer",tipo:"Plato principal",tiempo:"35 min",prep:"20 min",airfryer:"12-15 min",temp:"180°C",cal:"380 kcal",prot:"22g",carb:"38g",gras:"16g",servings:2,ings:["1 taza de pollo cocido y desmechado","1/2 taza de papa cocida y triturada","1/4 cebolla cabezona finamente picada","1/2 cdta de ajo en polvo","1/2 cdta de color o paprika","Sal y pimienta al gusto","8 discos pequeños de masa para empanadas o tapas listas","1 cdta de aceite para pincelar"],pasos:["Mezcla el pollo desmechado con papa, cebolla, ajo en polvo, color o paprika, sal y pimienta.","Coloca una cucharada pequeña de relleno en cada disco de masa.","Cierra las empanaditas y presiona los bordes con un tenedor.","Pincela ligeramente con aceite por ambos lados.","Cocina en Air Fryer a 180°C por 12-15 minutos, volteando a mitad de cocción."],tip:"No pongas demasiado relleno para evitar que las empanaditas se abran durante la cocción.",consejo:"Si usas masa casera, déjala delgada pero firme para que se cocine bien y no quede cruda por dentro."},
{id:77,num:26,titulo:"Ají Suave y Chips de Plátano",tipo:"Acompañamiento",tiempo:"20 min",prep:"8 min",airfryer:"10-12 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["1 plátano verde grande","1 cda de aceite","1/2 cdta de sal","1 tomate pequeño picado","2 cdas de cebolla larga finamente picada","1 cdta de cilantro picado","1 cda de jugo de limón","Sal al gusto","Ají dulce o gotas de ají picante opcional"],pasos:["Pela el plátano verde y córtalo en rodajas delgadas. Mezcla con aceite y sal.","Cocina en Air Fryer a 180°C por 10-12 minutos, moviendo a mitad de cocción.","Mezcla el tomate, cebolla larga, cilantro, limón y sal para preparar el ají suave.","Agrega ají dulce o picante al gusto.","Sirve los chips de plátano acompañados del ají suave."],tip:"Corta el plátano en rodajas delgadas y parejas para que los chips queden más crocantes.",consejo:""},
{id:78,num:26,titulo:"Buñuelitos Dulces Rápidos",tipo:"Postre",tiempo:"20 min",prep:"10 min",airfryer:"8-10 min",temp:"160°C",cal:"",prot:"",carb:"",gras:"",servings:8,ings:["1/2 taza de harina de trigo","1/4 taza de queso costeño campesino o mozzarella rallado suave","2 cdas de azúcar","1 huevo pequeño","2 cdas de leche","1/2 cdta de polvo de hornear","1/4 cdta de esencia de vainilla opcional","1 pizca de sal","Azúcar pulverizada para decorar opcional"],pasos:["Mezcla en un bol la harina, el queso rallado, el azúcar, el polvo de hornear y la sal.","Agrega el huevo, la leche y la esencia de vainilla. Mezcla hasta obtener una masa suave.","Forma bolitas pequeñas con las manos ligeramente engrasadas.","Coloca los buñuelitos en la Air Fryer dejando espacio entre ellos.","Cocina a 160°C por 8-10 minutos o hasta que estén dorados. Deja enfriar y decora con azúcar pulverizada si deseas."],tip:"Haz las bolitas pequeñas para que se cocinen bien por dentro sin que se doren demasiado por fuera.",consejo:""},
{id:79,num:27,titulo:"Pollo al Limón con Ajo",tipo:"Plato principal",tiempo:"30 min",prep:"10 min",airfryer:"18-20 min",temp:"190°C",cal:"330 kcal",prot:"39g",carb:"3g",gras:"17g",servings:2,ings:["1 pechuga de pollo en 2 filetes medianos","1 cda de aceite","2 dientes de ajo finamente picados o 1 cdta de ajo en polvo","Jugo de 1 limón pequeño","1/2 cdta de paprika","1/2 cdta de orégano seco opcional","Sal y pimienta al gusto","Rodajas de limón para servir opcional","Perejil picado opcional"],pasos:["Mezcla el aceite, el ajo, el jugo de limón, la paprika, el orégano, la sal y la pimienta.","Unta bien los filetes de pollo con la mezcla por ambos lados.","Coloca el pollo en la Air Fryer sin encimarlo.","Cocina a 190°C por 18-20 minutos, volteando a mitad de cocción.","Sirve con perejil picado y rodajas de limón si deseas."],tip:"No uses demasiado jugo de limón para evitar que el pollo quede muy ácido o pierda textura.",consejo:"Si los filetes son muy gruesos, ábrelos un poco para que se cocinen parejo y queden jugosos."},
{id:80,num:27,titulo:"Coliflor Dorada Especiada",tipo:"Acompañamiento",tiempo:"22 min",prep:"5 min",airfryer:"12-15 min",temp:"180°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 tazas de coliflor en arbolitos pequeños","1 cda de aceite","1/2 cdta de paprika","1/2 cdta de ajo en polvo","1/4 cdta de cúrcuma opcional","Sal y pimienta al gusto","Queso parmesano o rallado opcional","Perejil picado opcional"],pasos:["Lava y seca bien la coliflor.","Mezcla con aceite, paprika, ajo en polvo, cúrcuma, sal y pimienta.","Cocina en Air Fryer a 180°C por 12-15 minutos, moviendo a mitad de cocción.","Agrega queso rallado al final si deseas más sabor y mezcla suavemente."],tip:"No llenes demasiado la canasta para que la coliflor pueda dorarse mejor y quede crocante por fuera.",consejo:""},
{id:81,num:27,titulo:"Manzanas Rellenas de Avena",tipo:"Postre",tiempo:"22 min",prep:"8 min",airfryer:"10-12 min",temp:"170°C",cal:"",prot:"",carb:"",gras:"",servings:2,ings:["2 manzanas medianas","1/4 taza de avena en hojuelas","1 cda de panela pulverizada o azúcar morena","1/2 cdta de canela en polvo","1 cdta de mantequilla derretida","1 cda de nueces o maní picado opcional","Pasas opcional"],pasos:["Retira el centro de las manzanas con cuidado sin romperlas completamente.","Mezcla avena, panela, canela, mantequilla y nueces o pasas si deseas.","Rellena las manzanas con la mezcla preparada.","Coloca las manzanas en la Air Fryer.","Cocina a 170°C por 10-12 minutos, hasta que estén suaves y aromáticas."],tip:"Usa manzanas firmes como roja o verde para que mantengan su forma durante la cocción.",consejo:""},
{id:82,num:28,titulo:"Hamburguesitas de Atún",tipo:"Plato principal",tiempo:"25 min",prep:"12 min",airfryer:"10-12 min",temp:"180°C",cal:"340 kcal",prot:"31g",carb:"14g",gras:"18g",servings:2,ings:["2 latas de atún en agua o aceite bien escurridas","1 huevo pequeño","1/4 taza de miga de pan o avena molida","2 cdas de cebolla cabezona finamente picada","1 cda de cilantro o perejil picado opcional","1/2 cdta de ajo en polvo","1/2 cdta de paprika","Sal y pimienta al gusto","1 cdta de aceite para pincelar","Pan pequeño y vegetales opcionales para servir"],pasos:["Mezcla el atún escurrido con huevo, miga de pan, cebolla, cilantro, ajo en polvo, paprika, sal y pimienta.","Forma hamburguesitas medianas con las manos.","Pincela ligeramente con aceite por ambos lados.","Coloca las hamburguesitas en la Air Fryer sin amontonarlas.","Cocina a 180°C por 10-12 minutos, volteando a mitad de cocción."],tip:"Escurre muy bien el atún para evitar que la mezcla quede demasiado húmeda y difícil de formar.",consejo:"Si la mezcla está muy blanda, agrega un poco más de miga de pan o avena antes de formar las hamburguesitas."},
{id:83,num:28,titulo:"Croquetas de Papa y Queso",tipo:"Acompañamiento",tiempo:"22 min",prep:"10 min",airfryer:"10-12 min",temp:"190°C",cal:"",prot:"",carb:"",gras:"",servings:4,ings:["2 papas medianas cocidas y trituradas","1/2 taza de queso mozzarella o queso rallado","2 cdas de miga de pan","1/2 cdta de ajo en polvo","1/2 cdta de paprika opcional","Sal y pimienta al gusto","1 huevo pequeño opcional para dar más firmeza","Aceite en spray"],pasos:["Mezcla la papa triturada con queso, miga de pan, ajo en polvo, paprika, sal y pimienta.","Agrega huevo si la mezcla está muy seca o se desmorona.","Forma croquetas pequeñas o medianas.","Pincela ligeramente con aceite.","Cocina en Air Fryer a 190°C por 10-12 minutos, volteando a mitad de cocción."],tip:"Deja enfriar un poco la papa antes de formar las croquetas para que mantengan mejor la forma.",consejo:""},
